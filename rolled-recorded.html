<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Rolled &amp; Recorded — EDM Oatmeal Presents</title>
  <meta name="description" content="A digital festival day. Live from the studio. EDM Oatmeal Presents: Rolled &amp; Recorded."/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="EDM Oatmeal Presents: Rolled &amp; Recorded"/>
  <meta property="og:description" content="A digital festival day. Recorded from the studio."/>
  <meta property="og:image" content="https://fookn-oats.enterprises/rolled-recorded-og.png"/>
  <meta property="og:url" content="https://fookn-oats.enterprises/rolled-recorded"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="EDM Oatmeal Presents: Rolled &amp; Recorded"/>
  <meta name="twitter:description" content="A digital festival day. Recorded from the studio."/>
  <meta name="twitter:image" content="https://fookn-oats.enterprises/rolled-recorded-og.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --gold:#d4af37;--gold-hi:#f1d78a;--red:#c8323c;
      --bg:#0d0b09;--bg2:#15110e;
      --ivory:#f3ead8;
      --border:rgba(212,175,55,0.38);--border-soft:rgba(212,175,55,0.16);
      --text:var(--ivory);--muted:rgba(243,234,216,0.52);
      --mono:'Josefin Sans',sans-serif;
      --serif:'Cormorant Garamond',Georgia,serif;
      --display:'Poiret One','Josefin Sans',sans-serif;
    }
    html,body{background:var(--bg);color:var(--text);font-family:var(--serif);font-size:17px;line-height:1.7;min-height:100%;overflow-x:hidden}
    body{background-image:linear-gradient(180deg,#110e0b 0%,var(--bg) 260px)}

    /* ── HERO ── */
    #hero{
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      text-align:center;padding:56px 24px 72px;position:relative;overflow:hidden;
    }
    #hero-glow{
      position:absolute;inset:0;pointer-events:none;
      background:
        repeating-conic-gradient(from 0deg at 50% 50%, rgba(212,175,55,0.13) 0deg 0.6deg, transparent 0.6deg 7.5deg),
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(212,175,55,0.10) 0%, transparent 70%);
      -webkit-mask:radial-gradient(ellipse 64% 60% at 50% 50%,#000 0%,rgba(0,0,0,.6) 45%,transparent 78%);
      mask:radial-gradient(ellipse 64% 60% at 50% 50%,#000 0%,rgba(0,0,0,.6) 45%,transparent 78%);
    }
    .hero-eyebrow{
      font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.42em;
      color:var(--gold);text-transform:uppercase;margin-bottom:26px;
      position:relative;display:flex;align-items:center;gap:14px;justify-content:center;
    }
    .hero-eyebrow::before,.hero-eyebrow::after{content:'◆';font-size:7px;color:var(--gold);opacity:.8}
    .hero-title{
      font-family:var(--display);font-weight:400;text-transform:uppercase;
      font-size:clamp(40px,10.5vw,112px);
      line-height:1.02;letter-spacing:.08em;
      color:var(--ivory);position:relative;
      padding:26px 20px 22px;
      border-top:3px double var(--border);border-bottom:3px double var(--border);
      text-shadow:0 0 40px rgba(212,175,55,0.18);
    }
    .hero-title::before,.hero-title::after{
      content:'◆';position:absolute;left:50%;transform:translateX(-50%);
      font-size:9px;color:var(--gold);background:var(--bg);padding:0 10px;line-height:1;
    }
    .hero-title::before{top:-6px}
    .hero-title::after{bottom:-6px}
    .hero-title .line2{display:block}
    .hero-amp{color:var(--gold);font-style:normal}
    .hero-tagline{
      font-family:var(--mono);font-weight:300;font-size:clamp(10px,1.8vw,12px);
      letter-spacing:.36em;color:var(--muted);text-transform:uppercase;
      margin-top:26px;position:relative;
    }
    .hero-badge{
      display:inline-flex;align-items:center;gap:12px;position:relative;
      margin-top:34px;
      font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.26em;text-transform:uppercase;
      color:var(--gold);border:1px solid var(--gold);padding:10px 26px;
      box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 4px var(--border-soft);
    }
    .hero-badge::before,.hero-badge::after{content:'◆';font-size:7px}
    .hero-badge.live{background:var(--red);color:var(--ivory);border-color:var(--red);box-shadow:none}
    .hero-badge.live::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;flex-shrink:0}
    .hero-scroll{display:none}
    @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

    /* ── SECTION WRAPPER ── */
    .section{max-width:820px;margin:0 auto;padding:76px 24px 0}
    .section:last-of-type{padding-bottom:80px}
    .section-label{
      font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.38em;
      color:var(--gold);text-transform:uppercase;
      display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:36px;text-align:center;
    }
    .section-label::before,.section-label::after{
      content:'◆';flex:1;font-size:7px;line-height:1;color:var(--gold);opacity:.85;
      background:linear-gradient(90deg,transparent,var(--border)) no-repeat left center/calc(100% - 18px) 1px;
      text-align:right;
    }
    .section-label::after{
      background:linear-gradient(90deg,var(--border),transparent) no-repeat right center/calc(100% - 18px) 1px;
      text-align:left;
    }

    /* ── CONCEPT ── */
    .concept-headline{
      font-family:var(--serif);font-weight:600;
      font-size:clamp(24px,4.4vw,38px);line-height:1.15;letter-spacing:.01em;
      margin-bottom:18px;text-align:center;
    }
    .concept-body{
      font-size:18px;line-height:1.75;
      color:rgba(243,234,216,0.72);max-width:640px;margin:0 auto;text-align:center;
    }

    /* ── LINEUP ── */
    .lineup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
    .artist-card{
      position:relative;border:1px solid var(--border);background:var(--bg2);
      padding:26px 22px 24px;text-align:center;
      outline:1px solid var(--border-soft);outline-offset:4px;
      transition:border-color .18s,outline-color .18s,background .18s;
    }
    .artist-card::before{content:'◆';position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--gold);background:var(--bg);padding:0 8px;line-height:1}
    .artist-card:hover{border-color:var(--gold);outline-color:var(--border);background:#1a1512}
    .artist-name{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.05;margin-bottom:8px}
    .artist-role{font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
    .artist-time{font-family:var(--mono);font-weight:300;font-size:10px;letter-spacing:.2em;color:var(--muted);margin-top:12px;text-transform:uppercase}
    .artist-bio{font-size:16px;color:rgba(243,234,216,0.68);margin-top:12px;line-height:1.55}
    .tba-block{border:1px dashed var(--border);padding:48px 32px;text-align:center;grid-column:1/-1}
    .tba-title{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
    .tba-sub{font-size:16px;color:var(--muted);line-height:1.6;font-style:italic}

    /* ── SESSIONS ── */
    .session-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
    .session-card{
      position:relative;display:block;padding:28px 22px 24px;text-align:center;text-decoration:none;
      border:1px solid var(--border);outline:1px solid var(--border-soft);outline-offset:4px;background:var(--bg2);
      transition:border-color .18s,outline-color .18s,background .18s;
    }
    .session-card::before{content:'◆';position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--gold);background:var(--bg);padding:0 8px;line-height:1}
    .session-card:hover{border-color:var(--gold);outline-color:var(--border);background:#1a1512}
    .session-kicker{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:12px}
    .session-theme{font-family:var(--display);font-size:clamp(28px,6vw,40px);letter-spacing:.06em;text-transform:uppercase;color:var(--ivory);line-height:1.05;margin-bottom:10px}
    .session-meta{font-family:var(--mono);font-weight:300;font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:16px}
    .session-meta.live{color:var(--red);font-weight:600}
    .session-cta{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.26em;color:var(--gold);text-transform:uppercase;border:1px solid var(--gold);padding:9px 18px 7px;transition:background .18s,color .18s}
    .session-cta::before,.session-cta::after{content:'◆';font-size:6px}
    .session-card:hover .session-cta{background:var(--gold);color:#0d0b09}

    /* ── SCHEDULE ── */
    .schedule-list{display:flex;flex-direction:column;border-top:1px solid var(--border-soft)}
    .schedule-row{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:baseline;padding:15px 4px;border-bottom:1px solid var(--border-soft)}
    .sch-time{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--gold);letter-spacing:.18em;text-transform:uppercase}
    .sch-label{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.2}
    .sch-note{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);margin-top:3px;line-height:1.5}

    /* ── RSVP ── */
    .rsvp-card{position:relative;border:1px solid var(--border);outline:1px solid var(--border-soft);outline-offset:4px;background:var(--bg2);padding:38px 34px 34px}
    .rsvp-card::before{content:'◆';position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--gold);background:var(--bg);padding:0 8px;line-height:1}
    .rsvp-heading{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin-bottom:10px}
    .rsvp-body{font-size:17px;color:var(--muted);margin-bottom:26px;line-height:1.65}
    .rsvp-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
    .rsvp-input{flex:1;min-width:130px;background:transparent;border:0;border-bottom:1px solid var(--border);color:var(--ivory);font-family:var(--serif);font-size:17px;padding:10px 4px;outline:none;transition:border-color .2s}
    .rsvp-input:focus{border-bottom-color:var(--gold)}
    .rsvp-input::placeholder{color:rgba(243,234,216,.35);font-style:italic}
    .rsvp-btn{flex:0 0 auto;background:var(--gold);color:#0d0b09;border:none;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.26em;padding:13px 28px 11px;cursor:pointer;text-transform:uppercase;transition:background .18s}
    .rsvp-btn:hover{background:var(--gold-hi)}
    .rsvp-btn:disabled{opacity:.35;cursor:default}
    .rsvp-status{font-family:var(--mono);font-size:11px;letter-spacing:.1em;min-height:18px}

    /* ── DIVIDER ── */
    .divider{max-width:820px;margin:0 auto;padding:0 24px}
    .divider hr{border:none;border-top:1px solid var(--border-soft)}

    /* ── FOOTER ── */
    #footer{border-top:3px double var(--border-soft);margin-top:76px;padding:44px 24px 40px;text-align:center}
    .footer-links{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
    .footer-link{font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;text-decoration:none;transition:color .18s}
    .footer-link:hover{color:var(--gold)}
    .footer-brand{font-family:var(--mono);font-weight:300;font-size:9px;letter-spacing:.2em;color:rgba(243,234,216,.28);text-transform:uppercase}

    @media(max-width:480px){
      #hero{padding:44px 18px 60px}
      .section{padding:56px 18px 0}
      .rsvp-card{padding:28px 20px 26px}
      .rsvp-row{flex-direction:column}
      .rsvp-btn{width:100%;text-align:center}
      .hero-title{letter-spacing:.06em;padding:18px 8px 14px}
    }
  </style>
</head>
<body>

<div id="root"></div>

<script>
var RR_VERSION='rr-v1.10 · 2026.09.25'; // ← bump on every R&R deploy
(function(){
  var root=document.getElementById('root');

  function div(cls){var e=document.createElement('div');if(cls)e.className=cls;return e;}
  function el(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;return e;}
  function txt(e,t){e.textContent=t;return e;}

  /* ── HERO ── */
  function renderHero(ev){
    var hero=div();hero.id='hero';
    var glow=div();glow.id='hero-glow';hero.appendChild(glow);

    var eyebrow=div('hero-eyebrow');txt(eyebrow,(ev.presenter||'EDM Oatmeal')+' Presents:');
    hero.appendChild(eyebrow);

    var h1=el('h1','hero-title');
    var nameParts=(ev.name||'Rolled & Recorded').split('&');
    h1.innerHTML=nameParts[0]+'<span class="hero-amp">&</span>'+(nameParts[1]||'');
    hero.appendChild(h1);

    var tagline=div('hero-tagline');txt(tagline,ev.tagline||'A Digital Festival Day');
    hero.appendChild(tagline);

    var isLive=ev.status==='live';
    var badge=div('hero-badge'+(isLive?' live':''));
    var badgeText=isLive?'Live Now':((ev.dateDisplay&&ev.dateDisplay!=='Date TBA')?ev.dateDisplay:'Coming Soon');
    txt(badge,badgeText);
    hero.appendChild(badge);


    root.appendChild(hero);
  }

  /* ── CONCEPT ── */
  function renderConcept(c){
    if(!c) return;
    var sec=div('section');
    var label=div('section-label');txt(label,'What Is This');sec.appendChild(label);
    var h2=el('h2','concept-headline');txt(h2,c.headline||'');sec.appendChild(h2);
    var body=div('concept-body');txt(body,c.body||'');sec.appendChild(body);
    root.appendChild(sec);
  }

  /* ── LINEUP ── (only shown when artists are confirmed) */
  function renderLineup(lineup){
    if(!lineup||!lineup.length) return;
    var sec=div('section');
    var label=div('section-label');txt(label,'Lineup');sec.appendChild(label);
    var grid=div('lineup-grid');
    lineup.forEach(function(a){
      var card=div('artist-card');
      var name=div('artist-name');txt(name,a.name||'');card.appendChild(name);
      if(a.role){var role=div('artist-role');txt(role,a.role);card.appendChild(role);}
      if(a.setTime){var st=div('artist-time');txt(st,a.setTime);card.appendChild(st);}
      if(a.bio){var bio=div('artist-bio');txt(bio,a.bio);card.appendChild(bio);}
      grid.appendChild(card);
    });
    sec.appendChild(grid);root.appendChild(sec);
  }

  /* ── SCHEDULE ── (only shown when times are set) */
  function renderSchedule(sched){
    if(!sched||!sched.length) return;
    var hasRealTimes=sched.some(function(s){return s.time&&s.time!=='TBD'&&s.time!=='';});
    if(!hasRealTimes) return;
    var sec=div('section');
    var label=div('section-label');txt(label,'Run of Show');sec.appendChild(label);
    var list=div('schedule-list');
    sched.forEach(function(item){
      var row=div('schedule-row');
      var time=div('sch-time');txt(time,item.time||'TBD');row.appendChild(time);
      var right=div();
      var lbl=div('sch-label');txt(lbl,item.label||'');right.appendChild(lbl);
      if(item.note){var note=div('sch-note');txt(note,item.note);right.appendChild(note);}
      row.appendChild(right);list.appendChild(row);
    });
    sec.appendChild(list);root.appendChild(sec);
  }

  /* ── RSVP ── */
  function renderRSVP(rsvp){
    if(!rsvp||!rsvp.enabled) return;
    var sec=div('section');
    var label=div('section-label');txt(label,'Stay in the Loop');sec.appendChild(label);
    var card=div('rsvp-card');
    var h2=el('h2','rsvp-heading');txt(h2,rsvp.heading||'Stay in the Loop');card.appendChild(h2);
    var body=div('rsvp-body');txt(body,rsvp.body||'');card.appendChild(body);

    var nameIn=el('input','rsvp-input');nameIn.type='text';nameIn.placeholder='Name (optional)';
    var emailIn=el('input','rsvp-input');emailIn.type='email';emailIn.placeholder='Email address';
    emailIn.style.flex='2';
    var btn=el('button','rsvp-btn');txt(btn,'Notify Me');
    var status=div('rsvp-status');

    var row=div('rsvp-row');
    row.appendChild(nameIn);row.appendChild(emailIn);row.appendChild(btn);
    card.appendChild(row);card.appendChild(status);
    sec.appendChild(card);root.appendChild(sec);

    function submit(){
      var email=emailIn.value.trim();
      if(!email){emailIn.focus();return;}
      btn.disabled=true;txt(btn,'…');status.textContent='';
      fetch('https://formspree.io/f/'+(rsvp.formspreeId||''),{
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({
          _subject:'🥣 Rolled & Recorded — RSVP',
          name:nameIn.value.trim()||'anon',
          email:email,
          source:'rolled-recorded-rsvp'
        })
      }).then(function(r){
        if(r.ok){
          status.style.color='#5cd68a';
          txt(status,"You're in — we'll reach out when lineup drops.");
          nameIn.value='';emailIn.value='';
        } else {
          status.style.color='#ff6b6b';txt(status,'Something went wrong — try again.');
        }
      }).catch(function(){
        status.style.color='#ff6b6b';txt(status,'Something went wrong — try again.');
      }).finally(function(){btn.disabled=false;txt(btn,'Notify Me');});
    }
    btn.onclick=submit;
    emailIn.onkeydown=function(e){if(e.key==='Enter')submit();};
  }

  /* ── FOOTER ── */
  function renderFooter(links){
    var f=el('footer');f.id='footer';
    var fl=div('footer-links');
    if(links&&links.edmFeed){
      var l1=el('a','footer-link');l1.href=links.edmFeed;txt(l1,'◉ EDM OATS Feed');fl.appendChild(l1);
    }
    if(links&&links.instagram){
      var l2=el('a','footer-link');l2.href=links.instagram;l2.target='_blank';l2.rel='noopener';txt(l2,'◆ Instagram');fl.appendChild(l2);
    }
    var l3=el('a','footer-link');l3.href='/';txt(l3,'← Fook\'n Oats');fl.appendChild(l3);
    f.appendChild(fl);
    var brand=div('footer-brand');txt(brand,'EDM Oatmeal Presents · Rolled & Recorded · fookn-oats.enterprises');
    f.appendChild(brand);
    var stamp=div('footer-brand');txt(stamp,RR_VERSION);stamp.style.marginTop='6px';stamp.style.opacity='.5';
    f.appendChild(stamp);
    root.appendChild(f);
  }

  /* ── PORTILLO'S ── */
  function renderPortillos(){
    var sec=div('section');
    var label=div('section-label');txt(label,'Pre-Show Fuel');sec.appendChild(label);
    var card=div();
    card.style.cssText='border:1px solid rgba(212,175,55,0.15);background:var(--bg2);padding:24px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap';
    var copy=div();
    var h=div();h.style.cssText='font-family:var(--serif);font-weight:700;font-size:18px;margin-bottom:5px';txt(h,"Where's the nearest Portillo's?");
    var sub=div();sub.style.cssText='font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted)';txt(sub,'Italian beef. Hot dogs. Before or after the show.');
    copy.appendChild(h);copy.appendChild(sub);
    var btn=el('a');
    btn.href='https://locations.portillos.com';btn.target='_blank';btn.rel='noopener';
    btn.style.cssText='flex-shrink:0;display:inline-block;background:var(--gold);color:#0d0b09;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 20px;white-space:nowrap;text-decoration:none;transition:opacity .18s';
    txt(btn,'Find One Near Me');
    btn.onmouseover=function(){this.style.opacity='.8'};
    btn.onmouseout=function(){this.style.opacity='1'};
    card.appendChild(copy);card.appendChild(btn);
    sec.appendChild(card);root.appendChild(sec);
  }

  /* ── SESSIONS ── */
  function renderSessions(mount){
    fetch('/rr-events/index.json?t='+Date.now())
      .then(function(r){return r.json();})
      .then(function(idx){
        var events=idx.events||[];if(!events.length){mount.parentNode&&mount.parentNode.removeChild(mount);return;}
        var label=div('section-label');txt(label,'Sessions');mount.appendChild(label);
        var grid=div('session-grid');
        events.forEach(function(ev){
          var card=el('a','session-card');
          card.href=ev.href||('/rolled-recorded-event?slug='+ev.slug);
          var kicker=div('session-kicker');txt(kicker,(ev.series||'Rolled & Recorded')+' · '+(ev.session||ev.slug));
          var theme=div('session-theme');txt(theme,ev.theme||'Session Details');
          var meta=div('session-meta');
          if(ev.status==='live'){meta.classList.add('live');txt(meta,'◉ Live Now');}
          else if(ev.status==='past'){txt(meta,'Past · '+(ev.dateDisplay||''));}
          else{txt(meta,ev.dateDisplay||'Date TBA');}
          var cta=el('span','session-cta');txt(cta,ev.status==='live'?'Watch Live':'View the Session');
          card.appendChild(kicker);card.appendChild(theme);card.appendChild(meta);card.appendChild(cta);
          grid.appendChild(card);
        });
        mount.appendChild(grid);
      }).catch(function(){});
  }

  /* ── RENDER ── */
  function render(data){
    renderHero(data.event||{});
    renderConcept(data.concept);
    // Sessions mount — placed here so cards appear right after concept
    var sessionsSec=div('section');root.appendChild(sessionsSec);
    renderSessions(sessionsSec);
    renderLineup(data.lineup);
    renderSchedule(data.schedule);
    renderRSVP(data.rsvp);
    renderPortillos();
    renderFooter(data.links);
  }

  fetch('./rolled-recorded.json?t='+Date.now())
    .then(function(r){return r.json();})
    .then(render)
    .catch(function(){
      root.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:IBM Plex Mono,monospace;color:rgba(243,234,216,0.25);font-size:12px;letter-spacing:.1em">Loading…</div>';
    });
})();
</script>
</body>
</html>
