<head>

  <meta name="twitter:image" content="https://fookn-oats.enterprises/og.png"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    @keyframes oatsPulse{0%,100%{box-shadow:0 8px 30px rgba(255,180,0,.22),0 0 0 0 rgba(255,180,0,.5)}50%{box-shadow:0 8px 34px rgba(255,180,0,.45),0 0 0 10px rgba(255,180,0,0)}}
    :root{
      --gold:#ffb400;
      --bg:#090909;
      --bg2:rgba(10,10,10,0.6);
      --border:rgba(255,180,0,0.2);
      --text:#fff;
      --muted:rgba(255,255,255,0.5);
      --mono:'IBM Plex Mono',monospace;
      --serif:'Playfair Display',Georgia,serif;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:Georgia,serif;overflow-x:hidden;overflow-x:clip;overflow-anchor:none;touch-action:manipulation}

    /* ── SLIDESHOW BACKGROUND ── */
    #slideshow{position:absolute;top:0;left:0;right:0;height:100vh;max-height:960px;z-index:0;overflow:hidden;pointer-events:none}
    #slideshow img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;opacity:0}
    #slideshow img.active{opacity:1}
    
    #vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 48% 42% at 40% 36%,rgba(9,9,9,.74) 0%,rgba(9,9,9,.7) 60%,rgba(9,9,9,0) 100%),linear-gradient(180deg,rgba(9,9,9,.55) 0%,rgba(9,9,9,.62) 55%,rgba(9,9,9,.8) 85%,#090909 100%),radial-gradient(ellipse at center,transparent 40%,rgba(9,9,9,.45) 100%)}
    body{background:#090909}
    @media(max-width:700px){#vignette{background:radial-gradient(ellipse 95% 48% at 50% 40%,rgba(9,9,9,.74) 0%,rgba(9,9,9,.7) 65%,rgba(9,9,9,0) 100%),linear-gradient(180deg,rgba(9,9,9,.55) 0%,rgba(9,9,9,.62) 55%,rgba(9,9,9,.8) 85%,#090909 100%),radial-gradient(ellipse at center,transparent 40%,rgba(9,9,9,.45) 100%)}}

    /* ── TICKER ── */
    #ticker-bar{position:relative;background:#1a1a1a;border-top:1px solid rgba(255,180,0,0.15);border-bottom:1px solid rgba(255,180,0,0.3);overflow:hidden;display:none;height:24px;cursor:pointer}
    .ticker-track{}
    .ticker-text{display:flex;align-items:center;justify-content:center;height:24px;font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
    @keyframes ticker-drop{0%{transform:translateY(-24px)}14%{transform:translateY(0)}100%{transform:translateY(0)}}
    @keyframes tk-twinkle{0%,100%{opacity:0;transform:translateY(4px) scale(.5)}50%{opacity:.45;transform:translateY(12px) scale(.9)}}
    @media(max-width:600px){.ticker-text{font-size:9px;letter-spacing:.1em}}
    /* ── FLOATING AI CHAT ── */
    #ai-fab{position:fixed;bottom:16px;right:16px;z-index:100;width:48px;height:48px;border-radius:50%;background:rgba(9,9,9,.92);border:1px solid var(--gold);color:var(--gold);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.5),0 0 12px rgba(255,180,0,.25);backdrop-filter:blur(6px)}
    #ai-fab:hover{background:rgba(255,180,0,.1)}
    #ai-fab-hide{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:#1a1a1a;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.6);font-size:11px;line-height:16px;text-align:center;cursor:pointer}
    #ai-panel{position:fixed;bottom:76px;right:12px;left:12px;max-width:420px;margin-left:auto;z-index:101;background:rgba(9,9,9,.97);border:1px solid var(--gold);border-radius:12px;padding:6px;display:none;max-height:55vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.7)}
    #ai-panel .ai-box{margin:0;border:none;background:transparent;padding:12px 14px}
    #ai-panel .ai-sublabel{font-size:10px;margin-bottom:10px}
    #ai-panel .ai-input{padding:7px 10px}
    #ai-panel .ai-btn{padding:8px 12px;font-size:10px}
    #ai-panel .ai-q{font-size:10px;margin-top:10px}
    #ai-panel .ai-reply{font-size:11px;padding:10px 12px;line-height:1.6}
    #ai-panel .ai-route-btn{font-size:10px;padding:6px 12px}

    /* ── NAV ── */
    #nav-wrap{position:fixed;left:0;right:0;z-index:100;background:#090909;border-bottom:1px solid rgba(255,255,255,0.07)}
    #nav-top{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,0.04)}
    #nav-logo{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.15em;color:var(--gold);cursor:pointer;display:flex;flex-direction:column;line-height:1.1}
    #nav-logo .nav-ent{font-weight:400;font-size:8px;letter-spacing:.25em;color:rgba(255,180,0,0.6);text-transform:lowercase}
    #nav-version{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:rgba(255,255,255,0.28)}
    #talk-btn{background:var(--gold);border:1px solid var(--gold);color:#0a0a0a;font-family:var(--mono);font-weight:700;font-size:9px;cursor:pointer;letter-spacing:.1em;padding:3px 10px;white-space:nowrap;flex-shrink:0}
    #nav-logo,#nav-version{white-space:nowrap}
    @media(max-width:480px){#nav-logo{font-size:11px}#nav-version{font-size:8px}#talk-btn{font-size:8px;padding:3px 7px;letter-spacing:.06em}}
    #nav-tabs{display:flex;align-items:center;gap:18px;height:32px;padding:0 20px;overflow-x:auto}
    .nav-tab{background:none;border:none;color:rgba(255,255,255,0.45);font-family:var(--mono);font-size:9px;cursor:pointer;letter-spacing:.1em;padding:0;white-space:nowrap;flex-shrink:0;transition:color .2s}
    .nav-tab.active,.nav-tab:hover{color:var(--gold)}
    .nav-tab.active{font-weight:700;text-decoration:underline;text-underline-offset:4px}

    /* ── MAIN CONTENT ── */
    #app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:120px 32px 80px}

    /* ── BACK BUTTON ── */
    @keyframes back-pulse{0%,100%{opacity:1;text-shadow:0 0 8px #ffb400,0 0 20px #ffb400,0 0 40px rgba(255,180,0,.6)}50%{opacity:.6;text-shadow:0 0 4px #ffb400,0 0 10px rgba(255,180,0,.4)}}
    @keyframes back-border-pulse{0%,100%{box-shadow:0 0 8px rgba(255,180,0,.8),0 0 20px rgba(255,180,0,.4),inset 0 0 8px rgba(255,180,0,.1);border-color:#ffb400}50%{box-shadow:0 0 4px rgba(255,180,0,.4),0 0 10px rgba(255,180,0,.2),inset 0 0 4px rgba(255,180,0,.05);border-color:rgba(255,180,0,.6)}}
    .back-btn{position:fixed;bottom:18px;left:16px;z-index:100;background:#090909;border:1px solid var(--gold);color:var(--gold);font-family:var(--mono);font-size:11px;cursor:pointer;padding:10px 22px;letter-spacing:.15em;display:flex;align-items:center;gap:8px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.5);transition:all .15s}
    .back-btn:hover{transform:scale(1.04)}
    .back-btn span{}
    .back-btn:hover{animation:none!important;box-shadow:0 0 12px rgba(255,180,0,.5)!important;border-color:#ffb400!important;background:rgba(255,180,0,.08)!important}
    .back-btn:hover span{animation:none!important;text-shadow:none!important}

    /* ── CARDS ── */
    .card{border:1px solid rgba(255,255,255,0.1);background:var(--bg2);padding:24px 22px;cursor:pointer;transition:all .2s;position:relative;background:#1a1a1a}
    .card:hover{border-color:var(--gold);background:rgba(255,180,0,.05)}
    .card-icon{font-size:20px;margin-bottom:8px;color:var(--gold)}
    .card-label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gold);margin-bottom:6px;text-transform:uppercase}
    .card-tagline{color:rgba(255,255,255,.55);font-size:13px;line-height:1.5}
    .card-view{position:absolute;bottom:14px;right:16px;font-family:var(--mono);font-size:10px;color:var(--gold);display:none}
    .card:hover .card-view{display:block}
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
    .card-grid-sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}

    /* ── SECTION HEADERS ── */
    .sec-tag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--gold);margin-bottom:12px;text-decoration:underline;text-underline-offset:4px}
    .sec-title{font-family:var(--serif);font-size:clamp(28px,5vw,52px);font-weight:900;margin:0 0 12px;letter-spacing:-.02em}
    .sec-desc{color:rgba(255,255,255,.5);font-size:15px;line-height:1.75;max-width:540px;margin-bottom:36px}

    /* ── HOME ── */
    .home-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold);margin-bottom:16px}
    .home-title{font-family:var(--serif);font-size:clamp(42px,7vw,88px);font-weight:900;line-height:1;letter-spacing:-.03em;margin:0 0 6px}
    .home-title span{color:var(--gold)}
    .home-ent{font-family:var(--mono);font-size:clamp(20px,3.4vw,42px);letter-spacing:.3em;color:rgba(255,180,0,0.7);text-transform:lowercase;margin:0 0 24px;display:block}
    .home-desc{font-size:clamp(14px,2vw,18px);color:rgba(255,255,255,.55);max-width:560px;line-height:1.75;margin:0 0 32px}
    .home-btns{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:64px}
    .btn-primary{background:var(--gold);color:#0a0a0a;border:none;padding:13px 28px;font-family:var(--mono);font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.1em}
    .btn-secondary{background:#1a1a1a;border:1px solid #ffb400;color:#ffffff;padding:13px 28px;font-family:var(--mono);font-size:12px;cursor:pointer;letter-spacing:.1em}
    .btn-ghost{background:rgba(9,9,9,.85);border:1px solid rgba(255,180,0,.6);color:#ffffff;padding:13px 28px;font-family:var(--mono);font-size:12px;cursor:pointer;letter-spacing:.1em}

    /* ── AI ROUTER ── */
    .ai-box{border:1px solid var(--border);padding:24px 28px;background:#1a1a1a;margin-bottom:64px}
    .ai-label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--gold);margin-bottom:4px}
    .ai-sublabel{color:rgba(255,255,255,.35);font-size:12px;margin-bottom:16px;font-family:var(--mono)}
    .ai-row{display:flex;gap:10px}
    .ai-input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);padding:10px 14px;color:#fff;font-family:var(--mono);font-size:16px;outline:none}
    .ai-btn{background:var(--gold);color:#0a0a0a;border:none;padding:10px 20px;font-family:var(--mono);font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.08em;white-space:nowrap}
    .ai-btn:disabled{background:rgba(255,180,0,.3);cursor:wait}
    .ai-q{margin-top:14px;font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.3)}
    .ai-reply{background:rgba(255,180,0,.06);border:1px solid rgba(255,180,0,.25);border-radius:4px;padding:14px 18px;margin-top:10px;font-family:var(--mono);font-size:13px;color:#e8d5a3;line-height:1.7}
    .ai-reply-label{color:var(--gold);margin-right:8px}
    .ai-route-btn{display:block;margin-top:12px;background:var(--gold);color:#0a0a0a;border:none;padding:7px 16px;font-family:var(--mono);font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.08em}

    /* ── UNIVERSE LABEL ── */
    .universe-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.3);margin-bottom:20px}

    /* ── FOOTER ── */
    .footer{margin-top:60px;border-top:1px solid rgba(255,255,255,.06);padding-top:24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .footer span{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.2)}

    /* ── DETAIL PAGE ── */
    .detail-wrap{max-width:680px;margin:0 auto;padding:0 0 60px}
    .detail-icon{font-size:30px;margin-bottom:10px;color:var(--gold)}
    .detail-title{font-family:var(--serif);font-size:clamp(28px,5vw,48px);font-weight:900;margin:0 0 8px;letter-spacing:-.02em}
    .detail-sub{color:var(--gold);font-family:var(--mono);font-size:11px;letter-spacing:.12em;margin-bottom:24px}
    .detail-desc{color:rgba(255,255,255,.7);font-size:15px;line-height:1.8;margin-bottom:28px}
    .bullet-list{margin-bottom:36px}
    .bullet-item{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;color:rgba(255,255,255,.65);font-size:14px}
    .bullet-dot{color:var(--gold);margin-top:2px;flex-shrink:0}
    .inquiry-box{border:1px solid rgba(255,180,0,.2);padding:28px 24px;background:rgba(255,180,0,.03);margin-bottom:20px}
    .inquiry-label{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--gold);margin-bottom:20px}
    .field-label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:rgba(255,255,255,.4);margin-bottom:6px}
    .field-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);padding:10px 12px;color:#fff;font-family:var(--mono);font-size:16px;outline:none;box-sizing:border-box;margin-bottom:16px}
    .field-textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);padding:10px 12px;color:#fff;font-family:var(--mono);font-size:16px;outline:none;resize:vertical;box-sizing:border-box;margin-bottom:20px}
    .submit-btn{background:var(--gold);color:#0a0a0a;border:none;padding:12px 28px;font-family:var(--mono);font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.12em}
    .submit-btn:disabled{background:rgba(255,180,0,.3);cursor:not-allowed}
    .direct-email{margin-top:12px;font-size:11px;color:rgba(255,255,255,.25);font-family:var(--mono)}
    .calendly-box{padding:20px 24px;border:1px solid rgba(255,255,255,.06)}
    .calendly-label{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:rgba(255,255,255,.3);margin-bottom:10px}
    .calendly-btn{background:none;border:1px solid rgba(255,180,0,.4);color:var(--gold);padding:10px 22px;font-family:var(--mono);font-size:11px;cursor:pointer;letter-spacing:.1em}
    .brand-note{padding:20px 24px;border:1px solid rgba(255,180,0,.15);background:rgba(255,180,0,.02)}
    .brand-note-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.3);margin-bottom:8px}
    .brand-note-text{color:rgba(255,255,255,.4);font-size:13px;line-height:1.6}

    /* ── ABOUT ── */
    .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .about-link-btn{background:none;border:1px solid rgba(255,255,255,.08);padding:14px 16px;color:rgba(255,255,255,.5);font-family:var(--mono);font-size:11px;letter-spacing:.08em;cursor:pointer;text-align:left}
    .about-link-btn span{color:var(--gold);margin-right:8px}

    /* ── GALLERY ── */
    #gallery{position:fixed;inset:0;z-index:200;background:rgba(9,9,9,.97);overflow-y:auto;padding:80px 32px 60px;display:none}
    .gallery-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;max-width:900px;margin-left:auto;margin-right:auto}
    .gallery-count{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold)}
    .gallery-close{background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);font-family:var(--mono);font-size:11px;padding:8px 16px;cursor:pointer}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;max-width:900px;margin:0 auto}
    .gallery-thumb{aspect-ratio:16/9;background-size:cover;background-position:center;cursor:pointer;opacity:.8;transition:all .2s}
    .gallery-thumb:hover{opacity:1}

    /* ── LIGHTBOX ── */
    #lightbox{position:fixed;inset:0;z-index:210;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;cursor:zoom-out}
    #lightbox img{max-width:90vw;max-height:90vh;object-fit:contain}
    #lightbox-counter{position:absolute;bottom:24px;font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.3)}
    .lb-btn{position:absolute;top:50%;transform:translateY(-50%);background:none;border:1px solid rgba(255,255,255,.2);color:#fff;font-family:var(--mono);font-size:18px;padding:12px 18px;cursor:pointer}
    #lb-prev{left:24px}
    #lb-next{right:24px}

    /* form error/success */
    .form-err{color:#ff5555;font-family:var(--mono);font-size:11px;margin-bottom:12px}
    .home-headline{font-family:var(--serif);font-size:clamp(22px,3.6vw,38px);font-weight:900;line-height:1.15;margin:0 0 16px;letter-spacing:-.01em}
    .text-link{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(255,180,0,.35)}
    .combo-wrap{position:relative;display:inline-block}
    .combo-menu{display:none;position:absolute;top:100%;left:0;margin-top:6px;z-index:50;min-width:220px;background:#111;border:1px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.6)}
    .combo-opt{display:flex;justify-content:space-between;width:100%;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.08);color:#fff;font-family:var(--mono);font-size:12px;letter-spacing:.1em;padding:12px 16px;cursor:pointer;text-align:left}
    .combo-opt:hover{background:rgba(255,180,0,.08)}
    .combo-opt b{color:var(--gold)}
    .combo-opt span{color:rgba(255,255,255,.5)}
    .home-section{margin-bottom:48px}
    .hq-block{border:1px solid rgba(255,180,0,.18);background:#141414;padding:18px 20px;margin-bottom:14px}
    .hq-label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--gold);margin-bottom:8px}
    .hq-line{color:rgba(255,255,255,.72);font-size:15px;line-height:1.7;margin-bottom:12px}
    .hq-line a{color:var(--gold)}
    .hq-detail{color:rgba(255,255,255,.5);font-size:13px;line-height:1.6;margin-bottom:12px}
    .hq-spaces{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gold);margin-bottom:14px}
    .link-soon{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.45);margin-left:12px;align-self:center}
    .teaser{border-top:1px solid rgba(255,255,255,.07);padding:28px 0;margin-bottom:8px}
    .teaser-line{color:rgba(255,255,255,.7);font-size:16px;line-height:1.7;margin-bottom:16px;max-width:620px}
    .jag-off{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:rgba(255,255,255,.35);margin-top:36px}
    .hib-card{cursor:default}
    .hib-tag{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.4);margin-bottom:6px}
    select.field-input{appearance:auto}
    .bullet-item a{color:var(--gold);text-decoration:none}
    .form-success{color:var(--gold);font-family:var(--mono);font-size:13px;line-height:1.8}
  </style>
</head>
<body>

// ── EASTER EGG: MATRIX RAIN (tap the ticker) ─────────────────────────────────
var _mxOn = false;
function matrixRain(){
  if (_mxOn) return; _mxOn = true;
  var cv = document.createElement("canvas");
  cv.style.cssText = "position:fixed;inset:0;z-index:220;background:rgba(9,9,9,.94);cursor:pointer";
  document.body.appendChild(cv);
  var ctx = cv.getContext("2d");
  function size(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
  size();
  window.addEventListener("resize", size);
  var chars = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄFOOK'NOATS01△✦";
  var fs = 16, cols = Math.ceil(window.innerWidth/fs), drops = [];
  for (var i = 0; i < cols; i++) drops[i] = Math.random()*-40;
  var iv = setInterval(function(){
    ctx.fillStyle = "rgba(9,9,9,.08)";
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.font = fs + "px monospace";
    for (var i = 0; i < cols; i++) {
      ctx.fillStyle = Math.random() < .08 ? "#fff" : "#ffb400";
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*fs, drops[i]*fs);
      if (drops[i]*fs > cv.height && Math.random() > .975) drops[i] = 0;
      drops[i]++;
    }
  }, 50);
  function close(){ clearInterval(iv); window.removeEventListener("resize", size); cv.remove(); _mxOn = false; }
  cv.addEventListener("click", close);
  setTimeout(close, 15000);
}

// ── AI ROUTER ─────────────────────────────────────────────────────────────────
function routeQuery(text) {
  var t = text.toLowerCase();
  for (var item of AI_KEYWORDS) {
    if (item.keywords.some(function(k){ return t.includes(k); })) return item;
  }
  return null;
}

function handleAI(inputId, repliesId) {
  var input = document.getElementById(inputId);
  var q = input.value.trim();
  if (!q || aiTyping) return;
  input.value = "";
  aiTyping = true;
  setTimeout(function() {
    aiTyping = false;
    var route = routeQuery(q);
    var msg = route
      ? "Sounds like " + route.label + ". " + route.tagline
      : "Say a little more. The HQ, SuperTech LX, lighting design, a custom build, gear rental, merch, or music?";
    aiReplies.push({q, msg, route});
    renderView(currentView);
    if (aiPanelOpen) refreshAiPanel();
  }, 700 + Math.random()*400);
  renderView(currentView);
  if (aiPanelOpen) refreshAiPanel();
}

  box.appendChild(replyList);
  return box;
}

function inquiryForm(dept, presetOption, presetSubject) {
  var formState = {name:"",email:"",phone:"",detail:"",option:(presetOption||dept.option||""),status:"idle",err:""};
  var wrap = el("div");
  function validate() {
    if (!formState.name.trim() && !formState.email.trim()) return "NAME AND EMAIL REQUIRED.";
    if (!formState.name.trim()) return "Name, please.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formState.email.trim())) return "That email doesn't look right. Check it and try again.";
    if (formState.phone && !/^[\d\s()+\-.]+$/.test(formState.phone)) return "Digits only, or leave it blank.";
    return "";
  }
  function renderForm() {
    wrap.innerHTML = "";
    if (formState.status === "success") {
      wrap.appendChild(el("div","form-success","Signal received. Check your inbox. Our system is already on it. You'll get a reply in a minute or two with a few quick questions and a link to grab a call."));
      return;
    }
    wrap.appendChild(el("label","field-label","WHAT DO YOU NEED?"));
    var sel = el("select"); sel.className = "field-input"; sel.id = "need-sel";
    var o0 = el("option","","Choose one…"); o0.value = ""; sel.appendChild(o0);
    CONTACT_OPTIONS.forEach(function(o){ var op = el("option","",o.label); op.value = o.id; if (o.id === formState.option) op.selected = true; sel.appendChild(op); });
    sel.onchange = function(){ formState.option = this.value; };
    wrap.appendChild(sel);
    [
      {key:"name",label:"NAME",type:"text"},
      {key:"email",label:"EMAIL",type:"email"},
      {key:"phone",label:"PHONE / TEXT (OPTIONAL)",type:"tel"},
    ].forEach(function(f) {
      var lbl = el("label","field-label"); lbl.textContent = f.label; lbl.setAttribute("for",f.key+"-inp");

          if(window.__edmStopReload) return;

          if(f && !window.__edmReloaded){ window.__edmReloaded=true; f.src=f.src; }
        }, 4000);
      }
      // TAP FOR SOUND overlay — shown for BOTH live and playlist videos
      var unmute=el("div"); unmute.id="edm-unmute";
      var bg = live ? "rgba(255,59,59,.96)" : "rgba(255,180,0,.96)";
      var fg = live ? "#fff" : "#0a0a0a";
      unmute.style.cssText="position:absolute;top:0;left:0;right:0;z-index:5;cursor:pointer;background:linear-gradient(180deg,"+bg+",rgba(0,0,0,0));padding:14px 16px 28px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:.16em;font-weight:700;color:"+fg+";text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.25)";
      unmute.innerHTML="<span style='font-size:18px'>\uD83D\uDD0A</span> TAP FOR SOUND";
      function ytCmd(fn,arg){ try{ ifr.contentWindow.postMessage(JSON.stringify({event:"command",func:fn,args:arg!==undefined?[arg]:[]}),"*"); }catch(e){} }
      unmute.onclick=function(){ window.__edmStopReload=true; ytCmd("unMute"); ytCmd("setVolume",100); ytCmd("playVideo"); if(unmute.parentNode) unmute.parentNode.removeChild(unmute); };
      stage.appendChild(unmute);
    }

    function posterInStage(id, live, label){
      stage.innerHTML="";
      stage.style.boxShadow="0 18px 60px rgba(0,0,0,.6), 0 0 0 1px " + (live?"rgba(255,59,59,.45)":"rgba(255,180,0,.28)") + (live?", 0 0 40px rgba(255,59,59,.18)":"");
      var poster=el("div"); poster.style.cssText="position:absolute;inset:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden";
      var im=document.createElement("img"); im.src="https://i.ytimg.com/vi/"+id+"/sddefault.jpg"; im.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover";
      im.onerror=function(){ if(this.src.indexOf("sddefault")>-1)this.src="https://i.ytimg.com/vi/"+id+"/hqdefault.jpg"; else if(this.src.indexOf("hqdefault")>-1)this.src="https://i.ytimg.com/vi/"+id+"/mqdefault.jpg"; };
      im.onload=function(){ if(this.naturalWidth<=120 && this.src.indexOf("hqdefault")<0){ this.src="https://i.ytimg.com/vi/"+id+"/hqdefault.jpg"; } };
      poster.appendChild(im);
      var sh=el("div"); sh.style.cssText="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.55))"; poster.appendChild(sh);
      var acc=live?"#ff3b3b":"var(--gold)";
      var b=el("div"); b.style.cssText="position:relative;width:88px;height:88px;border-radius:50%;background:"+acc+";display:flex;align-items:center;justify-content:center;box-shadow:0 0 36px "+(live?"rgba(255,59,59,.55)":"rgba(255,180,0,.5)")+";transition:transform .15s";
      b.innerHTML="<span style='color:"+(live?"#fff":"#0a0a0a")+";font-size:36px;margin-left:6px'>\u25B6</span>"; poster.appendChild(b);
      var l=el("div"); l.style.cssText="position:relative;margin-top:16px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:#fff;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.7)"; l.textContent=label; poster.appendChild(l);
      poster.onmouseenter=function(){ b.style.transform="scale(1.08)"; }; poster.onmouseleave=function(){ b.style.transform="scale(1)"; };
      poster.onclick=function(){ playInStage(id, live); };
      stage.appendChild(poster);
    }
    function addThumb(id,title){
      var t=el("div"); t.style.cssText="position:relative;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,180,0,.18)";
      var im=document.createElement("img"); im.src="https://i.ytimg.com/vi/"+id+"/hqdefault.jpg"; im.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"; t.appendChild(im);
      var pl=el("div"); pl.style.cssText="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.15);transition:background .15s"; pl.innerHTML="<span style='color:#fff;font-size:22px;text-shadow:0 2px 6px rgba(0,0,0,.7)'>\u25B6</span>"; t.appendChild(pl);
      if(title) t.title=title;
      t.onmouseenter=function(){ pl.style.background="rgba(0,0,0,.35)"; }; t.onmouseleave=function(){ pl.style.background="rgba(0,0,0,.15)"; };
      t.onclick=function(){ playInStage(id,false); window.scrollTo({top:liveWrap.offsetTop-90,behavior:"smooth"}); };
      grid.appendChild(t);
    }

    function liveMsgBar(){
      var box=el("div"); box.id="edm-msgbar"; box.style.cssText="max-width:1040px;margin:14px auto 0";
      var lbl=el("div"); lbl.style.cssText="font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:#ff3b3b;text-transform:uppercase;margin:0 0 8px"; lbl.textContent="\u25CF MESSAGE THE BOOTH";
      box.appendChild(lbl);
      var row=el("div"); row.style.cssText="display:flex;gap:8px;flex-wrap:wrap";
      var name=document.createElement("input"); name.type="text"; name.placeholder="NAME (OPTIONAL)"; name.style.cssText="flex:0 0 130px;min-width:110px;background:rgba(0,0,0,.45);border:1px solid rgba(255,180,0,.25);border-radius:8px;color:#fff;font-family:var(--mono);font-size:13px;padding:11px 12px";
      var msg=document.createElement("input"); msg.type="text"; msg.placeholder="Message the booth\u2026"; msg.style.cssText="flex:1 1 200px;min-width:160px;background:rgba(0,0,0,.45);border:1px solid rgba(255,180,0,.25);border-radius:8px;color:#fff;font-family:var(--mono);font-size:13px;padding:11px 12px";
      var btn=el("button"); btn.textContent="SEND \u2192"; btn.style.cssText="flex:0 0 auto;background:#ff3b3b;color:#fff;border:none;border-radius:8px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;padding:11px 22px;cursor:pointer";
      row.appendChild(name); row.appendChild(msg); row.appendChild(btn); box.appendChild(row);
      var note=el("div"); note.style.cssText="font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.4);margin-top:8px"; box.appendChild(note);
      function send(){
        var m=msg.value.trim(); if(!m){ msg.focus(); return; }
        btn.disabled=true; btn.textContent="\u2026"; note.textContent="";
        fetch("https://formspree.io/f/mlgwpppq",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
          body:JSON.stringify({_subject:"\uD83D\uDD34 EDM Oatmeal live message",name:(name.value.trim()||"anon"),message:m,source:"edm-live-bar"})})
          .then(function(r){ if(r.ok){ msg.value=""; note.style.color="#5cd68a"; note.textContent="\u2713 Sent to the booth."; } else { note.style.color="#ff6b6b"; note.textContent="\u26A0 Didn\'t send. Try again."; } })
          .catch(function(){ note.style.color="#ff6b6b"; note.textContent="\u26A0 Didn\'t send. Try again."; })
          .finally(function(){ btn.disabled=false; btn.textContent="SEND \u2192"; });
      }
      btn.onclick=send; msg.onkeydown=function(e){ if(e.key==="Enter") send(); };
      return box;
    }
    function renderLive(id){
      liveTag.style.color="#ff3b3b"; liveTag.innerHTML="<span style='width:8px;height:8px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 8px #ff3b3b;display:inline-block'></span> LIVE NOW \u00b7 EDM OATMEAL";
      // remove grid first so the live video does not compete for bandwidth, then autoplay
      if(grid.parentNode){ grid.parentNode.removeChild(grid); } if(gridLabel.parentNode){ gridLabel.parentNode.removeChild(gridLabel); }
      playInStage(id, true);
      liveNote.innerHTML = noteHtml("Live now. Tap to unmute. ");
      var oldBar=document.getElementById("edm-msgbar"); if(oldBar&&oldBar.parentNode) oldBar.parentNode.removeChild(oldBar);
      liveWrap.insertBefore(liveMsgBar(), liveNote);
    }
    function renderPlaylist(items){
      liveTag.style.color="var(--gold)"; liveTag.textContent="\u25C9 EDM OATMEAL \u00b7 LATEST";
      // Offline headlines the featured video (Ferry Corsten) — autoplay MUTED on load + TAP FOR SOUND overlay (same as live)
      var featured = SITE.youtube.fallbackVideoId || "_xyCffufcbs";
      playInStage(featured, false);
      grid.innerHTML="";
      (items||[]).forEach(function(v){ addThumb(v.id, v.title); });
      if(!grid.parentNode){ liveWrap.insertBefore(gridLabel, liveNote); liveWrap.insertBefore(grid, liveNote); }
      liveNote.innerHTML = noteHtml("Tap for sound. Pick any video below. ");
    }

    liveWrap.appendChild(liveNote);
    app.appendChild(liveWrap);

    // Seed instantly with fallback poster so it's never blank while the API responds
    posterInStage(SITE.youtube.fallbackVideoId||"_xyCffufcbs", false, "PLAY WITH SOUND");

    var K=SITE.youtube.apiKey, CID=SITE.youtube.channelId;
    function loadPlaylist(){
      if(!K) return;
      fetch("https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=UU"+CID.slice(2)+"&maxResults=12&key="+K)
        .then(function(r){return r.json();}).then(function(p){
          var items=(p.items||[]).map(function(it){ return {id:it.snippet.resourceId.videoId, title:it.snippet.title}; });
          renderPlaylist(items);
        }).catch(function(){});
    }
    function publicLiveCheck(){
      if(!K){ loadPlaylist(); return; }
      fetch("https://www.googleapis.com/youtube/v3/search?part=snippet&channelId="+CID+"&eventType=live&type=video&maxResults=1&key="+K)
        .then(function(r){return r.json();}).then(function(d){
          if(d && d.items && d.items.length && d.items[0].id && d.items[0].id.videoId){ renderLive(d.items[0].id.videoId); }
          else { loadPlaylist(); }
        }).catch(function(){ loadPlaylist(); });
    }
    // Detection chain: 1) /api/live (OAuth, sees UNLISTED, fully auto) 2) live.json manual 3) public search 4) playlist
    function liveJsonCheck(){
      fetch("./live.json?t="+Date.now()).then(function(r){return r.json();}).then(function(L){
        if(L && L.liveVideoId){ renderLive(L.liveVideoId); } else { publicLiveCheck(); }
      }).catch(function(){ publicLiveCheck(); });
    }
    fetch("/api/live").then(function(r){return r.json();}).then(function(a){
      if(a && a.live && a.videoId){ renderLive(a.videoId); } else { liveJsonCheck(); }
    }).catch(function(){ liveJsonCheck(); });

    app.appendChild(detailPage({
      icon:"⊕", label:"EDM Oatmeal",
      desc:"Live streams, news, and ground crew updates from the EDM and touring world. Built by crew, for crew.",
      bullets:["EDM & touring news","Ground crew updates","Event tracking","@the_oats on Instagram","Go4Oats Show on YouTube"]
    }, "home", false));
    return;
  }

  // SECTION: CONNECT
  if (view === "section:connect") {
    var cp = detailPage({
      icon:"◆", label:"Connect",
      desc:"For work, follows, or just saying what's up.",
      bullets:["<a href='https://instagram.com/the_oats' target='_blank' rel='noopener'>@the_oats</a>","<a href='https://youtube.com/@go4oats' target='_blank' rel='noopener'>Go4Oats Show</a>","@ai_oatmeal","<a href='"+RENT_OATS_URL+"'>RENT.OATS</a>","SHOP.OATS","<a href='mailto:fookn.oats.enterprises@gmail.com'>fookn.oats.enterprises@gmail.com</a>"]
    }, "home", false);
    var cb = el("button","btn-primary","BOOK A CALL →"); cb.onclick = bookCall;
    cp.appendChild(cb);
    app.appendChild(cp);
    return;
  }

  // SECTION: ABOUT
  if (view === "section:about") {
    var wrap = el("div","");
    wrap.style.cssText = "max-width:620px";
    wrap.appendChild(backBtn("home"));
    wrap.appendChild(el("div","sec-tag","ABOUT"));
    var h2 = el("h2","sec-title"); h2.innerHTML = "Built on<br>the Road."; wrap.appendChild(h2);
    var paraStyles = [
      "color:rgba(255,255,255,.72);font-size:17px;line-height:1.75;margin-bottom:20px",
      "color:rgba(255,255,255,.60);font-size:15px;line-height:1.85;margin-bottom:20px",
      "color:rgba(255,255,255,.50);font-size:15px;line-height:1.85;margin-bottom:20px",
      "color:rgba(255,255,255,.43);font-size:15px;line-height:1.85;margin-bottom:36px"
    ];
    (SITE.about.paragraphs || []).forEach(function(text, i) {
      var p = el("p"); p.style.cssText = paraStyles[Math.min(i, paraStyles.length - 1)]; p.textContent = text; wrap.appendChild(p);
    });

    var aiSm = el("div",""); aiSm.style.cssText="border:1px solid rgba(255,180,0,.2);padding:22px;background:rgba(255,180,0,.02);margin-bottom:28px";
    var ail = el("div","",""); ail.style.cssText="font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--gold);margin-bottom:14px"; ail.textContent="◆ ASK OATS"; aiSm.appendChild(ail);
    var airow = el("div","ai-row");
    var aiinp = el("input"); aiinp.type="text"; aiinp.id="ai-input-about"; aiinp.className="ai-input"; aiinp.placeholder="What do you want to know?";
    aiinp.onkeydown = function(e){ if(e.key==="Enter") handleAI("ai-input-about","ai-replies-about"); };
    var aibtn = el("button","ai-btn","ASK");
    aibtn.onclick = function(){ handleAI("ai-input-about","ai-replies-about"); };
    airow.appendChild(aiinp); airow.appendChild(aibtn); aiSm.appendChild(airow);
    var aboutReplies = el("div"); aboutReplies.id="ai-replies-about";
    aiReplies.slice(-2).forEach(function(r) {
      var qDiv = el("div","ai-q","→ "+r.q); aboutReplies.appendChild(qDiv);
      var rep = el("div","ai-reply");
      rep.innerHTML = '<span class="ai-reply-label">◆ OATS →</span>'+r.msg;
      if (r.route) { var rb=el("button","ai-route-btn","OPEN "+r.route.label.toUpperCase()+" →"); rb.onclick=function(){routeClick(r.route);}; rep.appendChild(rb); }
      aboutReplies.appendChild(rep);
    });
    aiSm.appendChild(aboutReplies);
    wrap.appendChild(aiSm);

    var agrid = el("div","about-grid");
    SECTIONS.filter(function(s){return s.id!=="about";}).forEach(function(s) {
      var btn = el("button","about-link-btn"); btn.innerHTML="<span>"+s.icon+"</span>"+s.label;
      btn.onclick = sectionClick(s);
      agrid.appendChild(btn);
    });
    wrap.appendChild(agrid);
    wrap.appendChild(jagOff("JAG-OFF: Thank you for visiting FOOK'n OATS Enterprises. You did not have a choise. But thank you. This has been JAG-OFF. Start with a little."));
    app.appendChild(wrap);
    app.appendChild(siteFooter());
    return;
  }
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
// ── HASH ROUTING ──────────────────────────────────────────────────────────────
// view "section:edm" -> "#edm", "dept:cad" -> "#cad", "brand:revelator" -> "#revelator", "home" -> ""
function viewToHash(view){
  if(!view || view==="home") return "";
  return "#" + (view==="contact"?"contact":view).replace(/^(section:|dept:|brand:)/,"");
}
function hashToView(hash){
  var h=(hash||"").replace(/^#/,"").toLowerCase();
  if(!h) return "home";
  if(h==="services") return "section:supertech";
  if(h==="makerlab") return "section:hq";
  if(h==="sleepwell"||h==="ghosted"||h==="crypto") return "section:hibernating";
  if(h==="contact") return "contact";
  var depts=DEPARTMENTS.map(function(d){return d.id;});
  var brands=BRANDS.map(function(b){return b.id;});
  var sections=["hq","supertech","brands","hibernating","studio","stories","edm","about","connect"];
  if(depts.indexOf(h)>=0) return "dept:"+h;
  if(brands.indexOf(h)>=0) return "brand:"+h;
  if(sections.indexOf(h)>=0) return "section:"+h;
  return "home";
}
var _routing=true;
var _scrollPos = {};
var _scrollSeq = 0;
try { history.scrollRestoration = "manual"; } catch(e) {}
function _readScroll(){ return window.scrollY || window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0; }
function _applyScroll(y){ window.scrollTo(0,y); document.documentElement.scrollTop=y; document.body.scrollTop=y; }
document.addEventListener("scroll", function(){ if (currentView) _scrollPos[currentView] = _readScroll(); }, {passive:true});
document.addEventListener("touchstart", function(){ _scrollSeq++; }, {passive:true});
document.addEventListener("wheel", function(){ _scrollSeq++; }, {passive:true});
function resetZoom(){
  var vp = document.querySelector('meta[name="viewport"]');
  if (!vp) return;
  var orig = "width=device-width,initial-scale=1";
  vp.setAttribute("content", orig + ",minimum-scale=1,maximum-scale=1,user-scalable=0");
  setTimeout(function(){ vp.setAttribute("content", orig); }, 600);
}
window.addEventListener("load", function(){ setTimeout(resetZoom, 100); });
window.addEventListener("pageshow", function(e){ if (e.persisted) resetZoom(); });
// iOS Safari: block pinch/double-tap zoom at gesture level (viewport meta is ignored)
["gesturestart","gesturechange","gestureend"].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
});
function showView(view, restore) {
  if (currentView && currentView !== view) _scrollPos[currentView] = _readScroll();
  currentView = view;
  if (view === "home") resetZoom();
  renderView(view);
  var y = restore ? (_scrollPos[view] || 0) : 0;
  _scrollSeq++;
  var seq = _scrollSeq;
  var tries = 0;
  function ap(){
    if (seq !== _scrollSeq) return;
    _applyScroll(y);
    if (Math.abs(_readScroll() - y) < 2 || ++tries > 30) return;
    setTimeout(ap, 50);
  }
  ap();
  if(_routing){ var nh=viewToHash(view); if((location.hash||"")!==nh){ try{ history.pushState(null,"",nh||location.pathname); }catch(e){ location.hash=nh; } } }
}
function _routeFromHash(){ var v = hashToView(location.hash); if (v === currentView) return; _routing=false; showView(v, true); _routing=true; }
window.addEventListener("hashchange", _routeFromHash);
window.addEventListener("popstate", _routeFromHash);

// ── CALENDLY ─────────────────────────────────────────────────────────────────
function openCalendly(){
  if (window.Calendly) Calendly.initPopupWidget({ url: SITE.calendly.url });
  else window.open(SITE.calendly.url, "_blank");
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
showView(hashToView(location.hash));
</script>
