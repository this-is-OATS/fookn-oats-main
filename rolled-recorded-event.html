<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Rolled &amp; Recorded</title>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="https://fookn-oats.enterprises/edm-lite-og.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --gold:#d4af37;--gold-hi:#f1d78a;--red:#c8323c;
      --bg:#0d0b09;--bg2:#15110e;
      --ivory:#f3ead8;
      --border:rgba(212,175,55,0.38);--border-soft:rgba(212,175,55,0.16);--border-red:rgba(200,50,60,0.4);
      --text:var(--ivory);--muted:rgba(243,234,216,0.52);
      --mono:'Josefin Sans',sans-serif;
      --serif:'Cormorant Garamond',Georgia,serif;
      --display:'Poiret One','Josefin Sans',sans-serif;
    }
    html,body{background:var(--bg);color:var(--text);font-family:var(--serif);font-size:17px;line-height:1.7;min-height:100%;overflow-x:hidden}
    body{background-image:linear-gradient(180deg,#110e0b 0%,var(--bg) 220px)}

    /* ── TOP BAR ── */
    #topbar{
      position:fixed;top:0;left:0;right:0;z-index:100;
      background:rgba(13,11,9,0.94);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border-soft);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;height:42px;
    }
    #back-link{font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.22em;color:var(--muted);text-decoration:none;text-transform:uppercase;transition:color .18s}
    #back-link:hover{color:var(--gold)}
    #session-label{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}

    /* ── HERO ── */
    #hero{
      display:flex;flex-direction:column;
      align-items:center;justify-content:flex-start;
      text-align:center;padding:96px 24px 64px;position:relative;overflow:hidden;
    }
    #hero-glow{position:absolute;inset:0;pointer-events:none}
    /* sunburst: thin gold rays from behind the title, fading out */
    .hero-glow-gold{
      background:
        repeating-conic-gradient(from 0deg at 50% 46%, rgba(212,175,55,0.13) 0deg 0.6deg, transparent 0.6deg 7.5deg),
        radial-gradient(ellipse 70% 60% at 50% 46%, rgba(212,175,55,0.10) 0%, transparent 70%);
      -webkit-mask:radial-gradient(ellipse 62% 58% at 50% 46%,#000 0%,rgba(0,0,0,.6) 45%,transparent 78%);
      mask:radial-gradient(ellipse 62% 58% at 50% 46%,#000 0%,rgba(0,0,0,.6) 45%,transparent 78%);
    }
    .hero-glow-red{
      background:
        repeating-conic-gradient(from 0deg at 50% 46%, rgba(200,50,60,0.14) 0deg 0.6deg, transparent 0.6deg 7.5deg),
        radial-gradient(ellipse 70% 60% at 50% 46%, rgba(200,50,60,0.12) 0%, transparent 70%);
      -webkit-mask:radial-gradient(ellipse 62% 58% at 50% 46%,#000 0%,rgba(0,0,0,.6) 45%,transparent 78%);
      mask:radial-gradient(ellipse 62% 58% at 50% 46%,#000 0%,rgba(0,0,0,.6) 45%,transparent 78%);
    }
    .hero-eyebrow{
      font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.42em;
      color:var(--gold);text-transform:uppercase;margin-bottom:18px;
      display:flex;align-items:center;gap:14px;justify-content:center;position:relative;
    }
    .hero-eyebrow::before,.hero-eyebrow::after{content:'◆';font-size:7px;color:var(--gold);opacity:.8}
    .hero-session{
      font-family:var(--mono);font-weight:300;font-size:clamp(10px,2vw,12px);
      letter-spacing:.36em;color:var(--muted);text-transform:uppercase;
      margin-bottom:22px;position:relative;
    }
    .hero-theme{
      font-family:var(--display);font-weight:400;
      font-size:clamp(46px,11vw,104px);text-transform:uppercase;
      line-height:1;letter-spacing:.08em;
      color:var(--ivory);position:relative;
      padding:24px 18px 20px;margin-bottom:24px;
      border-top:3px double var(--border);border-bottom:3px double var(--border);
      text-shadow:0 0 40px rgba(212,175,55,0.18);
    }
    .hero-theme::before,.hero-theme::after{
      content:'◆';position:absolute;left:50%;transform:translateX(-50%);
      font-size:9px;color:var(--gold);background:var(--bg);padding:0 10px;line-height:1;
    }
    .hero-theme::before{top:-6px}
    .hero-theme::after{bottom:-6px}
    .hero-location{font-family:var(--mono);font-weight:300;font-size:11px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin-bottom:30px;position:relative}
    .hero-badge{
      display:inline-flex;align-items:center;gap:12px;position:relative;
      font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.26em;
      text-transform:uppercase;padding:10px 26px;
    }
    .hero-badge::before,.hero-badge::after{content:'◆';font-size:7px}
    .badge-soon{color:var(--gold);border:1px solid var(--gold);box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 4px var(--border-soft)}
    .badge-live{background:var(--red);color:#fff;border:1px solid var(--red);animation:badge-pulse 1.8s ease-in-out infinite}
    .badge-live::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;flex-shrink:0}
    .badge-past{color:var(--muted);border:1px solid rgba(243,234,216,0.2)}
    @keyframes badge-pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,50,60,.5)}50%{box-shadow:0 0 0 8px rgba(200,50,60,0)}}
    .hero-scroll{display:none}
    @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}
    @keyframes flash{0%,100%{opacity:1}50%{opacity:.15}}

    /* ── SECTIONS ── */
    .section{max-width:820px;margin:0 auto;padding:76px 24px 0}
    .section-label{
      font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.38em;
      color:var(--gold);text-transform:uppercase;
      display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:36px;text-align:center;
    }
    .section-label::before,.section-label::after{
      content:'◆';flex:1;font-size:7px;line-height:1;color:var(--gold);opacity:.85;
      background:linear-gradient(90deg,transparent,var(--border)) no-repeat left center/calc(100% - 18px) 1px;
      text-align:right;
    }
    .section-label::after{
      background:linear-gradient(90deg,var(--border),transparent) no-repeat right center/calc(100% - 18px) 1px;
      text-align:left;
    }
    .section-label.red{color:var(--red)}
    .section-label.red::before{color:var(--red);background-image:linear-gradient(90deg,transparent,var(--border-red))}
    .section-label.red::after{color:var(--red);background-image:linear-gradient(90deg,var(--border-red),transparent)}

    /* ── PLAYER ── */
    .player-wrap{position:relative;width:100%;padding-bottom:56.25%;height:0;overflow:hidden;background:#000;border:1px solid var(--border-red);outline:1px solid rgba(200,50,60,.18);outline-offset:5px;box-shadow:0 24px 60px rgba(0,0,0,.7)}
    .player-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
    .player-unmute{position:absolute;top:0;left:0;right:0;z-index:5;cursor:pointer;background:linear-gradient(180deg,rgba(200,50,60,.95),rgba(0,0,0,0));padding:16px 20px 32px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.22em;font-weight:600;color:#fff;text-transform:uppercase}

    /* ── SCHEDULE ── */
    .schedule-list{display:flex;flex-direction:column;border-top:1px solid var(--border-soft)}
    .schedule-row{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:baseline;padding:15px 4px;border-bottom:1px solid var(--border-soft)}
    .schedule-row.current{background:rgba(200,50,60,0.06);margin:0 -12px;padding:15px 16px;border-bottom:1px solid var(--border-red)}
    .schedule-row.current .sch-time{color:var(--red)}
    .schedule-row.current .sch-label{color:var(--ivory)}
    .schedule-row.past-slot .sch-time,.schedule-row.past-slot .sch-label{color:rgba(243,234,216,0.28)}
    .sch-time{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--gold);letter-spacing:.18em;text-transform:uppercase}
    .sch-label{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.01em;line-height:1.2}
    .sch-note{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);margin-top:3px}
    .now-tag{display:inline-block;font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:var(--red);border:1px solid var(--border-red);padding:3px 8px 2px;margin-left:10px;vertical-align:middle}

    /* ── LINEUP ── */
    .lineup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
    .artist-card{
      position:relative;border:1px solid var(--border);background:var(--bg2);
      padding:26px 22px 24px;text-align:center;
      outline:1px solid var(--border-soft);outline-offset:4px;
      transition:border-color .18s,outline-color .18s,background .18s;
    }
    .artist-card::before{content:'◆';position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--gold);background:var(--bg);padding:0 8px;line-height:1}
    .artist-card:hover{border-color:var(--gold);outline-color:var(--border);background:#1a1512}
    .artist-name{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.05;margin-bottom:8px;letter-spacing:.01em}
    .artist-role{font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
    .artist-time{font-family:var(--mono);font-weight:300;font-size:10px;letter-spacing:.2em;color:var(--muted);margin-top:12px;text-transform:uppercase}
    .artist-bio{font-family:var(--serif);font-size:16px;color:rgba(243,234,216,0.68);margin-top:12px;line-height:1.55}
    .tba-block{border:1px dashed var(--border);padding:48px 32px;text-align:center;grid-column:1/-1}
    .tba-title{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
    .tba-sub{font-size:16px;color:var(--muted);line-height:1.6;font-style:italic}

    /* ── ARCHIVE ── */
    .archive-player{position:relative;width:100%;padding-bottom:56.25%;height:0;overflow:hidden;background:#000;border:1px solid var(--border);outline:1px solid var(--border-soft);outline-offset:5px;box-shadow:0 24px 60px rgba(0,0,0,.7)}
    .archive-player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
    .highlights-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:16px}
    .highlight-thumb{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;cursor:pointer;border:1px solid var(--border-soft)}
    .highlight-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .highlight-thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2);color:#fff;font-size:16px}

    /* ── MESSAGE BOOTH ── */
    .booth-card{border:1px solid var(--border-red);outline:1px solid rgba(200,50,60,.15);outline-offset:4px;background:rgba(200,50,60,0.05);padding:30px 26px}
    .booth-label{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--red);text-transform:uppercase;margin-bottom:18px;text-align:center}
    .booth-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
    .booth-input{flex:1;min-width:120px;background:transparent;border:0;border-bottom:1px solid var(--border-red);color:var(--ivory);font-family:var(--serif);font-size:17px;padding:10px 4px;outline:none;transition:border-color .2s}
    .booth-input:focus{border-bottom-color:var(--red)}
    .booth-input::placeholder{color:rgba(243,234,216,.35);font-style:italic}
    .booth-btn{flex:0 0 auto;background:var(--red);color:#fff;border:none;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.26em;padding:13px 26px 11px;cursor:pointer;text-transform:uppercase;transition:background .18s}
    .booth-btn:hover{background:#e04450}
    .booth-btn:disabled{opacity:.35;cursor:default}
    .booth-status{font-family:var(--mono);font-size:11px;letter-spacing:.1em;min-height:16px}

    /* ── RSVP (also used by Artist Call) ── */
    .rsvp-card{position:relative;border:1px solid var(--border);outline:1px solid var(--border-soft);outline-offset:4px;background:var(--bg2);padding:36px 30px 32px}
    .rsvp-card::before{content:'◆';position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--gold);background:var(--bg);padding:0 8px;line-height:1}
    .rsvp-heading{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin-bottom:10px;letter-spacing:.01em}
    .rsvp-body{font-size:17px;color:var(--muted);margin-bottom:24px;line-height:1.65}
    .rsvp-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
    .rsvp-input{flex:1;min-width:120px;background:transparent;border:0;border-bottom:1px solid var(--border);color:var(--ivory);font-family:var(--serif);font-size:17px;padding:10px 4px;outline:none;transition:border-color .2s}
    .rsvp-input:focus{border-bottom-color:var(--gold)}
    .rsvp-input::placeholder{color:rgba(243,234,216,.35);font-style:italic}
    .rsvp-btn{flex:0 0 auto;background:var(--gold);color:#0d0b09;border:none;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.26em;padding:13px 28px 11px;cursor:pointer;text-transform:uppercase;transition:background .18s,color .18s}
    .rsvp-btn:hover{background:var(--gold-hi)}
    .rsvp-btn:disabled{opacity:.35;cursor:default}
    .rsvp-status{font-family:var(--mono);font-size:11px;letter-spacing:.1em;min-height:16px}

    /* ── FOOTER ── */
    #footer{border-top:3px double var(--border-soft);margin-top:76px;padding:44px 24px 40px;text-align:center}
    .footer-links{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
    .footer-link{font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;text-decoration:none;transition:color .18s}
    .footer-link:hover{color:var(--gold)}
    .footer-brand{font-family:var(--mono);font-weight:300;font-size:9px;letter-spacing:.2em;color:rgba(243,234,216,.28);text-transform:uppercase}

    @media(max-width:480px){
      #hero{padding:84px 18px 52px}
      .section{padding:56px 18px 0}
      .rsvp-card,.booth-card{padding:26px 18px 24px}
      .rsvp-row,.booth-row{flex-direction:column}
      .hero-theme{letter-spacing:.06em;padding:18px 8px 14px}
    }
  </style>
</head>
<body>

<div id="topbar">
  <a id="back-link" href="/rolled-recorded">← Rolled &amp; Recorded</a>
  <div id="session-label"></div>
</div>

<div id="root"></div>

<script>
var RR_VERSION='rr-v1.7 · 2026.09.25'; // ← bump on every R&R deploy
(function(){
  var root=document.getElementById('root');
  var sessionLabel=document.getElementById('session-label');

  function div(cls){var e=document.createElement('div');if(cls)e.className=cls;return e;}
  function el(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;return e;}
  function txt(e,t){e.textContent=t;return e;}

  /* ── SLUG ── */
  var slug=new URLSearchParams(window.location.search).get('slug')||window.location.pathname.split('/').filter(Boolean).pop()||'session-1';

  /* ── HERO ── */
  function renderHero(d,status){
    var hero=div();hero.id='hero';
    var glow=div();glow.id='hero-glow';
    glow.className='hero-glow-'+(status==='live'?'red':'gold');
    hero.appendChild(glow);

    var eyebrow=div('hero-eyebrow');txt(eyebrow,'EDM Oatmeal Presents');hero.appendChild(eyebrow);
    var sess=div('hero-session');txt(sess,'Rolled & Recorded · '+(d.session||''));hero.appendChild(sess);

    if(d.theme){
      var th=div('hero-theme');txt(th,d.theme);hero.appendChild(th);
    }

    if(d.location){var loc=div('hero-location');txt(loc,d.location);hero.appendChild(loc);}

    var badge=div('hero-badge');
    if(status==='live'){badge.className='hero-badge badge-live';txt(badge,'Live Now');}
    else if(status==='past'){badge.className='hero-badge badge-past';txt(badge,d.dateDisplay||'Past');}
    else{badge.className='hero-badge badge-soon';txt(badge,d.dateDisplay&&d.dateDisplay!=='Date TBA'?d.dateDisplay:'Coming Soon');}
    hero.appendChild(badge);

    root.appendChild(hero);
  }

  /* ── LIVE PLAYER ── */
  function renderLivePlayer(d){
    var sec=div('section');sec.style.paddingTop='80px';
    var label=div('section-label red');txt(label,'Now Streaming');sec.appendChild(label);

    var wrap=div('player-wrap');
    var vId=d.live&&d.live.videoId;
    if(vId){
      var ifr=document.createElement('iframe');
      ifr.src='https://www.youtube.com/embed/'+vId+'?autoplay=1&mute=1&playsinline=1&controls=1&rel=0&modestbranding=1&color=white&iv_load_policy=3';
      ifr.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      ifr.setAttribute('allowfullscreen','');
      wrap.appendChild(ifr);

      var un=div('player-unmute');
      un.innerHTML='<span style="font-size:18px">🔊</span> TAP FOR SOUND';
      un.onclick=function(){
        try{ifr.contentWindow.postMessage(JSON.stringify({event:'command',func:'unMute',args:[]}),'*');}catch(e){}
        try{ifr.contentWindow.postMessage(JSON.stringify({event:'command',func:'setVolume',args:[100]}),'*');}catch(e){}
        if(un.parentNode)un.parentNode.removeChild(un);
      };
      wrap.appendChild(un);
    } else {
      wrap.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:rgba(243,234,216,.3);text-transform:uppercase">Stream starting soon</div>';
    }
    sec.appendChild(wrap);
    root.appendChild(sec);
  }

  /* ── MESSAGE BOOTH ── */
  function renderBooth(d){
    var sec=div('section');
    var card=div('booth-card');
    var lbl=div('booth-label');txt(lbl,'● Message the Booth');card.appendChild(lbl);

    var nameIn=el('input','booth-input');nameIn.type='text';nameIn.placeholder='name (optional)';
    var msgIn=el('input','booth-input');msgIn.type='text';msgIn.placeholder='send a message to the booth…';msgIn.style.flex='2';
    var btn=el('button','booth-btn');txt(btn,'Send');
    var status=div('booth-status');

    var row=div('booth-row');
    row.appendChild(nameIn);row.appendChild(msgIn);row.appendChild(btn);
    card.appendChild(row);card.appendChild(status);
    sec.appendChild(card);root.appendChild(sec);

    function send(){
      var m=msgIn.value.trim();if(!m){msgIn.focus();return;}
      btn.disabled=true;txt(btn,'…');
      fetch('https://formspree.io/f/'+(d.rsvp&&d.rsvp.formspreeId||'mlgwpppq'),{
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({_subject:'🔴 R&R LIVE — booth message',name:nameIn.value.trim()||'anon',message:m,session:slug,source:'rr-booth'})
      }).then(function(r){
        if(r.ok){status.style.color='#5cd68a';txt(status,'Sent ✓');msgIn.value='';}
        else{status.style.color='#ff6b6b';txt(status,'Try again.');}
      }).catch(function(){status.style.color='#ff6b6b';txt(status,'Try again.');})
      .finally(function(){btn.disabled=false;txt(btn,'Send');});
    }
    btn.onclick=send;msgIn.onkeydown=function(e){if(e.key==='Enter')send();};
  }

  /* ── SCHEDULE ── */
  function renderSchedule(d,status){
    var sched=d.schedule||[];if(!sched.length)return;
    var sec=div('section');
    var label=div('section-label'+(status==='live'?' red':''));
    txt(label,'Run of Show');sec.appendChild(label);
    var list=div('schedule-list');
    var nowPlaying=d.live&&d.live.nowPlaying;
    var foundCurrent=false;
    sched.forEach(function(item){
      var row=div('schedule-row');
      var isCurrent=status==='live'&&nowPlaying&&item.label===nowPlaying;
      if(isCurrent){row.classList.add('current');foundCurrent=true;}
      else if(status==='live'&&!isCurrent&&!foundCurrent&&nowPlaying){row.classList.add('past-slot');}
      var time=div('sch-time');txt(time,item.time||'TBD');row.appendChild(time);
      var right=div();
      var lbl=div('sch-label');
      lbl.textContent=item.label||'';
      if(isCurrent){var tag=el('span','now-tag');txt(tag,'NOW');lbl.appendChild(tag);}
      right.appendChild(lbl);
      if(item.note){var note=div('sch-note');txt(note,item.note);right.appendChild(note);}
      row.appendChild(right);list.appendChild(row);
    });
    sec.appendChild(list);root.appendChild(sec);
  }

  /* ── LINEUP ── */
  function renderLineup(d){
    var lineup=d.lineup||[];
    var sec=div('section');
    var label=div('section-label');txt(label,'Lineup');sec.appendChild(label);
    if(d.lineupPlaceholder){
      var notice=div();
      notice.style.cssText='font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-bottom:22px;font-style:italic;animation:flash 1.6s ease-in-out infinite';
      txt(notice,'* These acts are placeholder examples — real lineup TBA');
      sec.appendChild(notice);
    }
    var grid=div('lineup-grid');
    if(!lineup.length){
      var tba=div('tba-block');
      var t1=div('tba-title');txt(t1,'Lineup TBA');tba.appendChild(t1);
      var t2=div('tba-sub');txt(t2,'Artists will be announced soon.');tba.appendChild(t2);
      grid.appendChild(tba);
    } else {
      lineup.forEach(function(a){
        var card=div('artist-card');
        var name=div('artist-name');txt(name,a.name||'');card.appendChild(name);
        if(a.role){var role=div('artist-role');txt(role,a.role);card.appendChild(role);}
        if(a.setTime){var st=div('artist-time');txt(st,a.setTime);card.appendChild(st);}
        if(a.bio){var bio=div('artist-bio');txt(bio,a.bio);card.appendChild(bio);}
        grid.appendChild(card);
      });
    }
    sec.appendChild(grid);root.appendChild(sec);
  }

  /* ── ARCHIVE PLAYER ── */
  function renderArchive(d){
    var arc=d.archive||{};
    var vId=arc.videoId||arc.aftermovieId;
    if(!vId&&!(arc.highlights&&arc.highlights.length))return;
    var sec=div('section');
    var label=div('section-label');txt(label,arc.aftermovieId?'Aftermovie':'Full Episode');sec.appendChild(label);
    if(vId){
      var wrap=div('archive-player');
      var ifr=document.createElement('iframe');
      ifr.src='https://www.youtube-nocookie.com/embed/'+vId+'?rel=0&modestbranding=1&color=white';
      ifr.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      ifr.setAttribute('allowfullscreen','');
      wrap.appendChild(ifr);sec.appendChild(wrap);
    }
    if(arc.highlights&&arc.highlights.length){
      var hlLabel=div('section-label');hlLabel.style.marginTop='28px';txt(hlLabel,'Highlights');sec.appendChild(hlLabel);
      var grid=div('highlights-grid');
      arc.highlights.forEach(function(hId){
        var t=div('highlight-thumb');
        var img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+hId+'/hqdefault.jpg';img.loading='lazy';
        var pl=div('play');pl.textContent='▶';
        t.appendChild(img);t.appendChild(pl);
        t.onclick=function(){window.open('https://youtu.be/'+hId,'_blank');};
        grid.appendChild(t);
      });
      sec.appendChild(grid);
    }
    root.appendChild(sec);
  }

  /* ── CONCEPT ── */
  function renderConcept(d){
    var c=d.concept;if(!c||(!c.headline&&!c.body))return;
    var sec=div('section');
    var label=div('section-label');txt(label,'What This Is');sec.appendChild(label);
    if(c.headline){var h=div();h.style.cssText='font-family:var(--serif);font-weight:700;font-size:clamp(20px,4vw,30px);line-height:1.2;margin-bottom:16px';txt(h,c.headline);sec.appendChild(h);}
    if(c.body){var b=div();b.style.cssText='font-size:15px;line-height:1.82;color:rgba(243,234,216,0.7);max-width:620px';txt(b,c.body);sec.appendChild(b);}
    if(c.note){var n=div();n.style.cssText='font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);margin-top:18px';txt(n,c.note);sec.appendChild(n);}
    root.appendChild(sec);
  }

  /* ── ON SITE ── */
  function renderOnSite(d){
    var items=d.onSite;if(!items||!items.length)return;
    var sec=div('section');
    var label=div('section-label');txt(label,'On Site');sec.appendChild(label);
    var list=div('schedule-list');
    items.forEach(function(it){
      var row=div('schedule-row');
      var k=div('sch-time');txt(k,it.label||'');row.appendChild(k);
      var right=div();
      var v=div('sch-label');txt(v,it.detail||'');right.appendChild(v);
      if(it.note){var n=div('sch-note');txt(n,it.note);right.appendChild(n);}
      row.appendChild(right);list.appendChild(row);
    });
    sec.appendChild(list);root.appendChild(sec);
  }

  /* ── ARTIST CALL ── */
  function renderArtistCall(d){
    var ac=d.artistCall;if(!ac||!ac.enabled)return;
    var sec=div('section');
    var label=div('section-label');txt(label,ac.label||'Play This Session');sec.appendChild(label);
    var card=div('rsvp-card');
    var h2=el('h2','rsvp-heading');txt(h2,ac.heading||'Artists — Get on the List');card.appendChild(h2);
    if(ac.body){var body=div('rsvp-body');txt(body,ac.body);card.appendChild(body);}
    if(ac.perks&&ac.perks.length){
      var ul=el('ul');ul.style.cssText='list-style:none;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:9px';
      ac.perks.forEach(function(p){
        var li=el('li');li.style.cssText='font-family:var(--mono);font-size:11px;letter-spacing:.04em;line-height:1.5;color:rgba(243,234,216,0.78);padding-left:20px;position:relative';
        var dot=el('span');dot.style.cssText='position:absolute;left:0;top:0;color:var(--gold);font-size:9px';dot.textContent='◆';
        li.appendChild(dot);li.appendChild(document.createTextNode(p));ul.appendChild(li);
      });
      card.appendChild(ul);
    }
    var nameIn=el('input','rsvp-input');nameIn.type='text';nameIn.placeholder='Artist / DJ name';
    var linkIn=el('input','rsvp-input');linkIn.type='text';linkIn.placeholder='Link to your music';linkIn.style.flex='2';
    var emailIn=el('input','rsvp-input');emailIn.type='email';emailIn.placeholder='Email address';emailIn.style.flex='2';
    var btn=el('button','rsvp-btn');txt(btn,ac.cta||'Get on the List');
    var status=div('rsvp-status');
    var row1=div('rsvp-row');row1.appendChild(nameIn);row1.appendChild(linkIn);
    var row2=div('rsvp-row');row2.appendChild(emailIn);row2.appendChild(btn);
    card.appendChild(row1);card.appendChild(row2);card.appendChild(status);sec.appendChild(card);root.appendChild(sec);

    function submit(){
      var name=nameIn.value.trim(),email=emailIn.value.trim();
      if(!name){nameIn.focus();return;}
      if(!email){emailIn.focus();return;}
      btn.disabled=true;txt(btn,'…');
      fetch('https://formspree.io/f/'+(ac.formspreeId||(d.rsvp&&d.rsvp.formspreeId)||'mlgwpppq'),{
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({_subject:'🎛 R&R ARTIST SIGN-UP — '+slug,artist:name,link:linkIn.value.trim(),email:email,session:slug,source:'rr-artist-call'})
      }).then(function(r){
        if(r.ok){status.style.color='#5cd68a';txt(status,"You're on the list. We'll reach out.");nameIn.value='';linkIn.value='';emailIn.value='';}
        else{status.style.color='#ff6b6b';txt(status,'Try again.');}
      }).catch(function(){status.style.color='#ff6b6b';txt(status,'Try again.');})
      .finally(function(){btn.disabled=false;txt(btn,ac.cta||'Get on the List');});
    }
    btn.onclick=submit;emailIn.onkeydown=function(e){if(e.key==='Enter')submit();};
  }

  /* ── RSVP ── */
  function renderRSVP(d){
    var rsvp=d.rsvp;if(!rsvp||!rsvp.enabled)return;
    var sec=div('section');
    var label=div('section-label');txt(label,'Stay in the Loop');sec.appendChild(label);
    var card=div('rsvp-card');
    var h2=el('h2','rsvp-heading');txt(h2,'Get Notified');card.appendChild(h2);
    var body=div('rsvp-body');txt(body,'Be first to know when lineup drops and the stream goes live.');card.appendChild(body);
    var nameIn=el('input','rsvp-input');nameIn.type='text';nameIn.placeholder='Name (optional)';
    var emailIn=el('input','rsvp-input');emailIn.type='email';emailIn.placeholder='Email address';emailIn.style.flex='2';
    var btn=el('button','rsvp-btn');txt(btn,'Notify Me');
    var status=div('rsvp-status');
    var row=div('rsvp-row');
    row.appendChild(nameIn);row.appendChild(emailIn);row.appendChild(btn);
    card.appendChild(row);card.appendChild(status);sec.appendChild(card);root.appendChild(sec);

    function submit(){
      var email=emailIn.value.trim();if(!email){emailIn.focus();return;}
      btn.disabled=true;txt(btn,'…');
      fetch('https://formspree.io/f/'+rsvp.formspreeId,{
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({_subject:'🥣 R&R RSVP — '+slug,name:nameIn.value.trim()||'anon',email:email,session:slug,source:'rr-rsvp'})
      }).then(function(r){
        if(r.ok){status.style.color='#5cd68a';txt(status,"You're in.");nameIn.value='';emailIn.value='';}
        else{status.style.color='#ff6b6b';txt(status,'Try again.');}
      }).catch(function(){status.style.color='#ff6b6b';txt(status,'Try again.');})
      .finally(function(){btn.disabled=false;txt(btn,'Notify Me');});
    }
    btn.onclick=submit;emailIn.onkeydown=function(e){if(e.key==='Enter')submit();};
  }

  /* ── PORTILLO'S ── */
  function renderPortillos(){
    var sec=div('section');
    var label=div('section-label');txt(label,"Pre-Show Fuel");sec.appendChild(label);
    var card=div();
    card.style.cssText='border:1px solid rgba(212,175,55,0.15);background:var(--bg2);padding:24px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap';
    var copy=div();
    var h=div();h.style.cssText='font-family:var(--serif);font-weight:700;font-size:18px;margin-bottom:5px';txt(h,"Where's the nearest Portillo's?");
    var sub=div();sub.style.cssText='font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted)';txt(sub,'Italian beef. Hot dogs. Before or after the show.');
    copy.appendChild(h);copy.appendChild(sub);
    var btn=el('a');
    btn.href='https://locations.portillos.com';
    btn.target='_blank';btn.rel='noopener';
    btn.style.cssText='flex-shrink:0;display:inline-block;background:var(--gold);color:#0d0b09;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 20px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:opacity .18s';
    txt(btn,'Find One Near Me');
    btn.onmouseover=function(){this.style.opacity='.8'};
    btn.onmouseout=function(){this.style.opacity='1'};
    card.appendChild(copy);card.appendChild(btn);
    sec.appendChild(card);root.appendChild(sec);
  }

  /* ── FOOTER ── */
  function renderFooter(d){
    var f=el('footer');f.id='footer';
    var fl=div('footer-links');
    var l1=el('a','footer-link');l1.href='/rolled-recorded';txt(l1,'↩ All Sessions');fl.appendChild(l1);
    var l2=el('a','footer-link');l2.href='/edm-lite';txt(l2,'◉ EDM Feed');fl.appendChild(l2);
    if(d.links&&d.links.instagram){var l3=el('a','footer-link');l3.href=d.links.instagram;l3.target='_blank';l3.rel='noopener';txt(l3,'◆ Instagram');fl.appendChild(l3);}
    f.appendChild(fl);
    if(d.partner&&d.partner.name){
      var pc=div('footer-brand');pc.style.cssText='font-size:9px;letter-spacing:.16em;color:rgba(243,234,216,.4);text-transform:uppercase;margin-bottom:12px';
      if(d.partner.url){var pa=el('a');pa.href=d.partner.url;pa.target='_blank';pa.rel='noopener';pa.style.cssText='color:var(--gold);text-decoration:none';txt(pa,d.partner.name);pc.appendChild(document.createTextNode((d.partner.role||'Partner')+' · '));pc.appendChild(pa);}
      else{txt(pc,(d.partner.role||'Partner')+' · '+d.partner.name);}
      f.appendChild(pc);
    }
    var brand=div('footer-brand');txt(brand,'EDM Oatmeal Presents · Rolled & Recorded · '+(d.session||''));
    f.appendChild(brand);
    var stamp=div('footer-brand');txt(stamp,RR_VERSION);stamp.style.marginTop='6px';stamp.style.opacity='.5';
    f.appendChild(stamp);root.appendChild(f);
  }

  /* ── RENDER ── */
  function render(d){
    var status=d.status||'coming_soon';
    if(d.session)txt(sessionLabel,d.session);

    renderHero(d,status);

    if(status==='live'){
      renderLivePlayer(d);
      renderBooth(d);
      renderSchedule(d,status);
      renderLineup(d);
    } else if(status==='past'){
      renderArchive(d);
      renderLineup(d);
      renderSchedule(d,status);
    } else {
      renderConcept(d);
      renderLineup(d);
      renderSchedule(d,status);
      renderOnSite(d);
      renderArtistCall(d);
      renderRSVP(d);
    }
    renderPortillos();
    renderFooter(d);
  }

  fetch('/rr-events/'+slug+'.json?t='+Date.now())
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(render)
    .catch(function(){
      root.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:IBM Plex Mono,monospace;color:rgba(243,234,216,.25);font-size:12px;letter-spacing:.1em;text-align:center;padding:40px">Session not found.<br><a href="/rolled-recorded" style="color:var(--gold);margin-top:12px;display:block">← Back to series</a></div>';
    });
})();
</script>
</body>
</html>
