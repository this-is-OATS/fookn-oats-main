  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --paper:#f3efe6;
      --mat:#faf8f3;
      --ink:#15140f;
      --ink-2:rgba(21,20,15,.66);
      --ink-3:rgba(21,20,15,.44);
      --rule:rgba(21,20,15,.14);
      --rule-2:rgba(21,20,15,.08);
      --accent:#5b1e22;
      --dark:#0e0d0b;
      --serif:'Cormorant Garamond',Garamond,'Times New Roman',serif;
      --sans:'Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
      --w:1120px;
    }
    html{background:var(--paper)}
    body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    a{color:inherit}
    img{display:block;max-width:100%}
    [hidden]{display:none!important}
    ::selection{background:var(--ink);color:var(--paper)}

    .wrap{max-width:var(--w);margin:0 auto;padding:0 32px}
    .label{font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
    .rule{height:1px;background:var(--rule)}
    .section{padding-top:96px}
    .section-head{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:40px;align-items:baseline;border-top:1px solid var(--rule);padding-top:22px}
    .sec-title{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.6vw,46px);line-height:1.06;letter-spacing:-.005em}
    .sec-text{font-size:16px;line-height:1.8;color:var(--ink-2);max-width:620px;margin-top:18px}
    .sec-text em,.hero-line em{font-family:var(--serif);font-style:italic;font-size:1.12em;color:var(--ink)}
    .link{font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:5px;display:inline-block;transition:color .2s,border-color .2s}
    .link:hover{color:var(--accent);border-color:var(--accent)}
    .btn{font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:12px;padding:18px 28px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);transition:background .2s,color .2s}
    .btn:hover{background:var(--paper);color:var(--ink)}
    .btn.ghost{background:transparent;color:var(--ink)}
    .btn.ghost:hover{background:var(--ink);color:var(--paper)}

    /* ── NAV ── */
    #nav{max-width:var(--w);margin:0 auto;padding:30px 32px 0;display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap}
    .wordmark{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:.02em;color:var(--ink);text-decoration:none;white-space:nowrap}
    .wordmark i{font-style:italic;color:var(--accent)}
    .nav-r{display:flex;gap:28px;align-items:center}
    .nav-r a{font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);text-decoration:none;white-space:nowrap;transition:color .2s}
    .nav-r a:hover{color:var(--ink)}
    #nav-version{font-family:var(--sans);font-weight:400;font-size:9px;letter-spacing:.1em;color:var(--ink-3);opacity:.6;white-space:nowrap}

    /* ── HERO ── */
    #hero{max-width:var(--w);margin:0 auto;padding:120px 32px 0}
    .hero-title{font-family:var(--serif);font-weight:500;font-size:clamp(58px,10.5vw,138px);line-height:.92;letter-spacing:-.02em;margin-top:26px;max-width:14ch}
    .hero-title .dot{color:var(--accent)}
    .hero-tagline{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(26px,3.4vw,40px);line-height:1.1;color:var(--ink-2);margin-top:30px}
    .hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:end;margin-top:52px;padding-top:34px;border-top:1px solid var(--rule)}
    .hero-line{font-size:17px;line-height:1.8;color:var(--ink-2);max-width:520px}
    .hero-ctas{display:flex;gap:28px;align-items:center;flex-wrap:wrap;justify-self:end}
    .hero-art{margin-top:72px}
    .hero-art .frame img{aspect-ratio:21/9}

    /* ── FRAMES (matted prints) ── */
    .print{display:block}
    .frame{background:var(--mat);border:1px solid var(--rule);padding:14px}
    .frame img{width:100%;height:100%;object-fit:cover;aspect-ratio:16/9;background:var(--dark)}
    .frame img.plot{object-fit:contain;aspect-ratio:auto;height:auto;background:#fff}
    .frame-foot{display:flex;justify-content:space-between;align-items:baseline;gap:10px 16px;margin-top:10px;flex-wrap:wrap}
    .print,.frame{min-width:0}
    .frame-cap{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-2);line-height:1.5}
    .frame-tag{font-family:var(--sans);font-weight:500;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);line-height:1.6}
    .frame-tag.ai{color:var(--accent);border:1px solid var(--accent);padding:5px 9px}
    .hero-grid>*,.section-head>*,.two>*,.ma3-grid>*,.partner-grid>*,.split>*{min-width:0}

    /* ── IS / ISN'T ── */
    .split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0;border-top:1px solid var(--rule)}
    .split > div{padding:36px 40px 40px 0;border-right:1px solid var(--rule)}
    .split > div:last-child{border-right:0;padding-left:40px;padding-right:0}
    .split-text{font-family:var(--serif);font-weight:500;font-size:clamp(24px,2.8vw,34px);line-height:1.22;margin-top:22px;max-width:18ch}
    .split .isnt .split-text{color:var(--ink-2);font-weight:400}
    .split .link{margin-top:26px}

    /* ── OFFER ── */
    .offer{list-style:none;counter-reset:o;margin-top:12px}
    .offer li{display:grid;grid-template-columns:72px minmax(0,300px) minmax(0,1fr);gap:28px;align-items:baseline;padding:30px 0;border-top:1px solid var(--rule-2)}
    .offer li:first-child{border-top:0}
    .o-num{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink-3)}
    .o-title{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1}
    .o-text{font-size:15px;line-height:1.75;color:var(--ink-2);max-width:520px}

    /* ── MA3 ── */
    .ma3-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:56px;align-items:start}
    .points{list-style:none;margin-top:30px;border-top:1px solid var(--rule-2)}
    .points li{padding:18px 0;border-bottom:1px solid var(--rule-2);font-size:15px;line-height:1.7;color:var(--ink-2)}
    .points li b{display:block;font-family:var(--serif);font-weight:500;font-size:21px;color:var(--ink);margin-bottom:4px}
    .ma3-images{display:grid;grid-template-columns:1fr;gap:28px}

    /* ── VIDEO ── */
    .video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:var(--dark);border:1px solid var(--rule)}
    .video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

    /* ── PROCESS ── */
    .process{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
    .step{padding:28px 24px 34px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:200px;display:flex;flex-direction:column}
    .step-num{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink-3)}
    .step-title{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.1;margin-top:auto;padding-top:28px}
    .step-text{font-size:13.5px;line-height:1.65;color:var(--ink-2);margin-top:10px}

    /* ── WORK ── */
    .work-group{margin-top:56px}
    .work-group:first-child{margin-top:0}
    .work-group-label{display:flex;align-items:center;gap:18px;margin-bottom:30px}
    .work-group-label::after{content:'';flex:1;height:1px;background:var(--rule-2)}
    .work-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:40px 32px}
    .work-media{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .work-media.single{grid-template-columns:1fr}
    .work-meta{padding-top:18px}
    .work-artist{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.05}
    .work-sub{font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin-top:10px}
    .work-line{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin-top:10px;max-width:60ch}
    .work-text-only{border-top:1px solid var(--rule-2);padding-top:22px}
    .work-meta-lead{padding-top:0;padding-bottom:22px;border-top:1px solid var(--rule-2);padding-top:22px}
    .work-meta-lead + .work-media{grid-template-columns:repeat(4,minmax(0,1fr))}
    @media(max-width:900px){.work-meta-lead + .work-media{grid-template-columns:1fr 1fr}}

    /* ── PARTNER (Rolled & Recorded) ── */
    .partner-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:56px;align-items:start}
    .partner-kicker{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink-2);margin-top:10px}
    .partner-facts{list-style:none;margin-top:30px;border-top:1px solid var(--rule-2)}
    .partner-facts li{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:14px 0;border-bottom:1px solid var(--rule-2);font-size:14.5px;line-height:1.6;color:var(--ink)}
    .partner-facts li span:first-child{font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);padding-top:4px}
    .partner-images{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .partner-images .print:first-child{grid-column:1 / -1}

    /* ── BILLING + CONTACT ── */
    .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:start}
    .bill-title{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.6vw,46px);line-height:1.06}
    .inquiry{border-top:1px solid var(--ink);padding-top:26px}
    .field-label{display:block;font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);margin-top:26px;margin-bottom:6px}
    .field-input,.field-textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px 0;color:var(--ink);font-family:var(--serif);font-size:20px;outline:none;border-radius:0;transition:border-color .2s}
    .field-input:focus,.field-textarea:focus{border-color:var(--ink)}
    .field-textarea{resize:vertical;min-height:84px;line-height:1.4}
    .field-input::placeholder,.field-textarea::placeholder{color:var(--ink-3);font-style:italic}
    .submit-btn{margin-top:34px}
    .submit-btn:disabled{opacity:.4;cursor:not-allowed}
    .form-err{color:var(--accent);font-family:var(--sans);font-size:12px;margin-top:16px;line-height:1.5}
    .form-success{font-family:var(--serif);font-size:22px;line-height:1.5;color:var(--ink)}
    .direct-email{font-family:var(--sans);font-size:11px;letter-spacing:.06em;color:var(--ink-3);margin-top:22px}
    .call-link{margin-top:34px}

    /* ── FOOTER ── */
    .footer{max-width:var(--w);margin:120px auto 0;padding:30px 32px 56px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:16px}
    .footer span,.footer a{font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);text-decoration:none}
    .footer a:hover{color:var(--ink)}
    .footer .wordmark{font-size:17px;text-transform:none;letter-spacing:.02em;color:var(--ink)}

    @media(max-width:900px){
      .process{grid-template-columns:repeat(2,minmax(0,1fr))}
      .two{grid-template-columns:minmax(0,1fr);gap:56px}
      .ma3-grid,.partner-grid{grid-template-columns:minmax(0,1fr);gap:36px}
      .section-head{grid-template-columns:minmax(0,1fr);gap:14px}
    }
    @media(max-width:640px){
      .wrap,#nav,#hero,.footer{padding-left:22px;padding-right:22px}
      #hero{padding-top:72px}
      .section{padding-top:72px}
      .hero-grid{grid-template-columns:minmax(0,1fr);gap:30px}
      .hero-ctas{justify-self:start}
      .offer li{grid-template-columns:44px minmax(0,1fr);gap:16px}
      .offer li .o-text{grid-column:2}
      .split > div{padding:30px 0;border-right:0;border-bottom:1px solid var(--rule)}
      .split > div:last-child{padding-left:0;border-bottom:0}
      .process{grid-template-columns:minmax(0,1fr)}
      .step{min-height:0}
      .nav-r{gap:14px;flex-wrap:wrap}
      .nav-r a:first-child{display:none}
      #nav-version{font-size:8px}
      .partner-images{grid-template-columns:minmax(0,1fr)}
      .partner-facts li{grid-template-columns:1fr;gap:4px}
    }
  </style>
</head>
<body>

  <nav id="nav">
    <a class="wordmark" href="/revelator">Revelator <i>Illuminae</i></a>
    <div class="nav-r">
      <a href="/#supertech">SuperTech LX</a>
      <a href="/#brands">FOOK'n OATS ↗</a>
      <span id="nav-version"></span>
    </div>
  </nav>

  <header id="hero">
    <div class="label" id="hero-eyebrow"></div>
    <h1 class="hero-title" id="hero-title"></h1>
    <div class="hero-tagline" id="hero-tagline"></div>
    <div class="hero-grid">
      <p class="hero-line" id="hero-line"></p>
      <div class="hero-ctas">
        <a class="btn" href="#book" id="hero-cta"></a>
        <a class="link" href="#offer" id="hero-cta2"></a>

  <section class="section wrap" id="isisnt">

    <ol class="offer" id="offer-grid"></ol>
  </section>

  <section class="section wrap" id="ma3" hidden>
    <div class="section-head"><div class="label" id="ma3-label"></div><h2 class="sec-title" id="ma3-title"></h2></div>
    <div class="ma3-grid" style="margin-top:34px">
      <div>
        <p class="sec-text" id="ma3-intro" style="margin-top:0"></p>

      </div>
      <div class="ma3-images" id="ma3-images"></div>

  <section class="section wrap" id="video" hidden>
    <div class="section-head"><div class="label" id="video-label"></div><h2 class="sec-title" id="video-title"></h2></div>

  </section>

  <section class="section wrap" id="process">
    <div class="section-head"><div class="label" id="process-label"></div><h2 class="sec-title">Five steps. No surprises.</h2></div>

  </section>

  <section class="section wrap" id="work" hidden>
    <div class="section-head"><div class="label" id="work-label"></div><div><h2 class="sec-title">Selected work.</h2><p class="sec-text" id="work-note"></p></div></div>
    <div id="work-groups" style="margin-top:44px"></div>
  </section>

  <section class="section wrap" id="partner" hidden>
    <div class="section-head"><div class="label" id="partner-label"></div><h2 class="sec-title" id="partner-title"></h2></div>
    <div class="partner-grid" style="margin-top:34px">
      <div>
        <div class="partner-kicker" id="partner-kicker"></div>
        <p class="sec-text" id="partner-text"></p>
        <ul class="partner-facts" id="partner-facts"></ul>
        <a class="link" id="partner-link" style="margin-top:30px"></a>
      </div>
      <div class="partner-images" id="partner-images"></div>
    </div>
  </section>

  <section class="section wrap" id="vizzies" hidden>
    <div class="section-head"><div class="label" id="vizzies-label"></div><div><h2 class="sec-title">The visuals, driven from the desk.</h2><p class="sec-text" id="vizzies-text"></p><a class="link" id="vizzies-link" target="_blank" rel="noopener" style="margin-top:26px"></a></div></div>
  </section>

  <section class="section wrap" id="book">
    <div class="section-head"><div class="label" id="billing-label"></div><div class="two">
      <div>
        <h2 class="bill-title" id="billing-title"></h2>
        <p class="sec-text" id="billing-text"></p>
        <h3 class="bill-title" id="contact-title" style="margin-top:56px;font-size:clamp(26px,3vw,36px)"></h3>
        <p class="sec-text" id="contact-text"></p>
        <a class="link call-link" id="call-link" target="_blank" rel="noopener"></a>
      </div>
      <div class="inquiry">
        <div class="label" id="contact-label"></div>
        <div id="form"></div>
      </div>
    </div></div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script src="./site.js"></script>
  <script>
  try { if (typeof SITE !== "undefined" && SITE.version) document.getElementById("nav-version").textContent = SITE.version; } catch(e) {}

  function el(t,cls,html){var e=document.createElement(t);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
  function txt(id,s){var n=document.getElementById(id);if(n)n.textContent=s||"";}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function show(id){document.getElementById(id).hidden=false;}

  // Truthful image tags. 'ai' is the hard-rule disclosure (CLAUDE.md): the file must ALSO carry the baked-in stamp.
  var TAGS = { vectorworks:"Vectorworks render", plot:"Plot capture", ma3:"grandMA3 screen", photo:"Photograph", ai:"◆ Render placeholder · AI generated ◆" };
  function frame(src, tag, caption, alt){
    var w = el("div","print");
    var f = el("div","frame");
    var t = (tag||"").toLowerCase();
    var img = el("img"); img.src = src; img.loading = "lazy"; img.alt = alt || caption || "";
    if (t==="plot") img.className = "plot";
    f.appendChild(img);
    w.appendChild(f);
    var foot = el("div","frame-foot");
    foot.appendChild(el("div","frame-cap",esc(caption||"")));
    if (TAGS[t]) foot.appendChild(el("span","frame-tag"+(t==="ai"?" ai":""),esc(TAGS[t])));
    w.appendChild(foot);
    return w;
  }

  function render(D){
    // HERO
    var h = D.hero || {};
    txt("hero-eyebrow", h.eyebrow);
    document.getElementById("hero-title").innerHTML = esc(h.title||"REVELATOR ILLUMINAE").replace(/^REVELATOR ILLUMINAE$/i,"Revelator<br>Illuminae<span class='dot'>.</span>");
    txt("hero-tagline", h.tagline); txt("hero-line", h.line);
    txt("hero-cta", h.ctaLabel || "Start a design inquiry"); txt("hero-cta2", h.secondaryLabel || "See the work");
    if (h.image) {
      var ha = document.getElementById("hero-art"); ha.hidden = false;
      ha.appendChild(frame(h.image, h.imageTag, h.imageCaption, "Revelator Illuminae"));
    }

    // IS / ISN'T
    var s = D.isIsnt || {}, split = document.getElementById("split");
    [["is",s.is],["isnt",s.isnt]].forEach(function(p){
      if (!p[1]) return;
      var c = el("div",p[0]);
      c.appendChild(el("div","label",esc(p[1].label)));
      c.appendChild(el("div","split-text",esc(p[1].text)));
      if (p[1].link) { var a = el("a","link",esc(p[1].linkLabel||"More")); a.href = p[1].link; c.appendChild(a); }
      split.appendChild(c);
    });

    // OFFER
    var o = D.offer || {items:[]};
    txt("offer-label", o.label||"The offer");
    var og = document.getElementById("offer-grid");
    (o.items||[]).forEach(function(i, n){
      var li = el("li");
      li.appendChild(el("div","o-num","0"+(n+1)));
      li.appendChild(el("div","o-title",esc(i.title)));
      li.appendChild(el("div","o-text",esc(i.text)));
      og.appendChild(li);
    });

    // MA3 SYSTEMS (hidden until the owner's words + grabs exist)
    var m = D.ma3 || {};
    if ((m.intro && m.intro.trim()) || (m.points||[]).length || (m.images||[]).length) {
      show("ma3");
      txt("ma3-label", m.label||"grandMA3 show-file systems"); txt("ma3-title", m.title); txt("ma3-intro", m.intro);
      var pts = document.getElementById("ma3-points");
      (m.points||[]).forEach(function(p){
        var li = el("li");
        li.innerHTML = typeof p === "string" ? esc(p) : "<b>"+esc(p.title)+"</b>"+esc(p.text);
        pts.appendChild(li);
      });
      var mi = document.getElementById("ma3-images");
      (m.images||[]).forEach(function(im){ mi.appendChild(frame(im.src, im.tag||"ma3", im.caption, im.alt)); });
    }

    // VIDEO (youtube-nocookie)
    var v = D.video || {};
    if (v.youtubeId && /^[\w-]{6,}$/.test(v.youtubeId)) {
      show("video");
      txt("video-label", v.label||"Walkthrough"); txt("video-title", v.title||"The file, walked through.");
      var ifr = el("iframe");
      ifr.src = "https://www.youtube-nocookie.com/embed/"+encodeURIComponent(v.youtubeId)+"?playsinline=1&controls=1&rel=0&modestbranding=1&color=white&iv_load_policy=3";
      ifr.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      ifr.setAttribute("allowfullscreen",""); ifr.title = v.title || "Revelator Illuminae walkthrough"; ifr.loading = "lazy";
      document.getElementById("video-wrap").appendChild(ifr);
      txt("video-cap", v.caption);
    }

    // PROCESS
    var pr = D.process || {steps:[]};
    txt("process-label", pr.label||"Process");
    var pg = document.getElementById("process-grid");
    (pr.steps||[]).forEach(function(st){
      var c = el("div","step");
      c.appendChild(el("div","step-num",esc(st.step)));
      c.appendChild(el("div","step-title",esc(st.title)));
      c.appendChild(el("div","step-text",esc(st.text)));
      pg.appendChild(c);
    });

    // SELECTED WORK (Designed vs Programmed / Supported — never blur the two)
    var w = D.work || {};
    var groups = [["Designed", w.designed||[]],["Programmed / Supported", w.supported||[]],[w.crewLabel||"Crew & Drafting", w.crew||[]],[w.earlierLabel||"Earlier", w.earlier||[]]].filter(function(g){return g[1].length;});
    if (groups.length) {
      show("work");
      txt("work-label", w.label||"Selected work"); txt("work-note", w.note);
      var wg = document.getElementById("work-groups");
      groups.forEach(function(g){
        var grp = el("div","work-group");
        grp.appendChild(el("div","work-group-label label",esc(g[0])));
        var grid = el("div","work-grid");
        g[1].forEach(function(e){
          var c = el("div");
          var media = el("div","work-media"), n = 0;
          if (e.plot)   { media.appendChild(frame(e.plot, e.plotTag||"plot", "", (e.artist||"")+" plot")); n++; }
          (e.plots||[]).forEach(function(p){ media.appendChild(frame(p.src, p.tag||"plot", p.caption||"", p.alt||((e.artist||"")+" plot detail"))); n++; });
          if (e.render) { media.appendChild(frame(e.render, e.renderTag||"vectorworks", "", (e.artist||"")+" render")); n++; }
          if (n < 2) media.className += " single";
          var meta = el("div","work-meta"+(n?"":" work-text-only"));
          meta.appendChild(el("div","work-artist",esc(e.artist)));
          meta.appendChild(el("div","work-sub",esc([e.event,e.year,e.role].filter(Boolean).join("  ·  "))));
          if (e.line) meta.appendChild(el("div","work-line",esc(e.line)));
          // Wide entries (3+ plates) span the row: title first so the plates read as this show's.
          if (n > 2) { c.style.gridColumn = "1 / -1"; meta.className += " work-meta-lead"; c.appendChild(meta); c.appendChild(media); }
          else { if (n) c.appendChild(media); c.appendChild(meta); }
          grid.appendChild(c);
        });
        grp.appendChild(grid); wg.appendChild(grp);
      });
    }

    // DESIGN PARTNER — Rolled & Recorded (hidden until filled)
    var pt = D.partner || {};
    if (pt.title || pt.text) {
      show("partner");
      txt("partner-label", pt.label||"Design partner"); txt("partner-title", pt.title); txt("partner-kicker", pt.kicker); txt("partner-text", pt.text);
      var pf = document.getElementById("partner-facts");
      (pt.facts||[]).forEach(function(f){ var li = el("li"); li.appendChild(el("span","",esc(f.label))); li.appendChild(el("span","",esc(f.value))); pf.appendChild(li); });
      var pl = document.getElementById("partner-link");
      if (pt.url) { pl.href = pt.url; pl.textContent = pt.linkLabel || "Rolled & Recorded"; } else pl.hidden = true;
      var pi = document.getElementById("partner-images");
      (pt.images||[]).forEach(function(im){ pi.appendChild(frame(im.src, im.tag, im.caption, im.alt)); });
      if (!(pt.images||[]).length) pi.hidden = true;
    }

    // GO4OATS.VIZZIES — only if it has a destination
    var vz = D.vizzies || {};
    if (vz.url) {
      show("vizzies");
      txt("vizzies-label", vz.label||"Go4oats.vizzies"); txt("vizzies-text", vz.text);
      var vl = document.getElementById("vizzies-link"); vl.href = vz.url; vl.textContent = vz.linkLabel || "Open";
    }

    // BILLING + CONTACT
    var b = D.billing || {}, ct = D.contact || {};
    txt("billing-label", b.label||"How it's billed"); txt("billing-title", b.title); txt("billing-text", b.text);
    txt("contact-title", ct.title); txt("contact-text", ct.text);
    var cl = document.getElementById("call-link");
    if (ct.callUrl) { cl.href = ct.callUrl; cl.textContent = ct.callLabel || "Prefer a call?"; } else cl.hidden = true;
    txt("contact-label", ct.label||"Book it");
    inquiryForm(ct);

    // FOOTER
    var f = D.footer || {};
    document.getElementById("footer").innerHTML =
      '<a class="wordmark" href="/revelator">Revelator <i>Illuminae</i></a>' +
      '<span>'+esc(f.brandLine||"A FOOK'n OATS brand")+'</span>' +
      '<span><a href="'+esc(f.homeUrl||"/#brands")+'">'+esc(f.homeLabel||"All brands")+'</a>' +
      (f.supertechUrl ? ' &nbsp;·&nbsp; <a href="'+esc(f.supertechUrl)+'">'+esc(f.supertechLabel||"SuperTech LX")+'</a>' : '') + '</span>';
  }

  // Inquiry form — same Formspree endpoint + payload shape as index.html, preset to the design option.
  function inquiryForm(ct){
    var wrap = document.getElementById("form");
    var st = {name:"",email:"",phone:"",detail:"",status:"idle",err:""};
    function validate(){
      if (!st.name.trim() && !st.email.trim()) return "A name and an email, please.";
      if (!st.name.trim()) return "Name, please.";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(st.email.trim())) return "That email doesn't look right. Check it and try again.";
      if (st.phone && !/^[\d\s()+\-.]+$/.test(st.phone)) return "Digits only, or leave it blank.";
      return "";
    }
    function draw(){
      wrap.innerHTML = "";
      if (st.status === "success") { wrap.appendChild(el("div","form-success","Received. You'll hear back with a few questions and a time to talk.")); return; }
      [{key:"name",label:"Name",type:"text"},{key:"email",label:"Email",type:"email"},{key:"phone",label:"Phone (optional)",type:"tel"}].forEach(function(fd){
        var lbl = el("label","field-label",fd.label); lbl.setAttribute("for","rv-"+fd.key);
        var inp = el("input"); inp.type = fd.type; inp.id = "rv-"+fd.key; inp.className = "field-input"; inp.value = st[fd.key];
        inp.oninput = function(){ st[fd.key] = this.value; };
        wrap.appendChild(lbl); wrap.appendChild(inp);
      });
      wrap.appendChild(el("label","field-label","The show"));
      var ta = el("textarea"); ta.className = "field-textarea"; ta.rows = 3; ta.placeholder = "Artist, dates, the room, who's hanging it"; ta.value = st.detail;
      ta.oninput = function(){ st.detail = this.value; };
      wrap.appendChild(ta);
      if (st.err) wrap.appendChild(el("div","form-err",esc(st.err)));
      if (st.status==="error") wrap.appendChild(el("div","form-err","Didn't send. Try again, or write to "+esc(ct.directEmail||"fookn.oats.enterprises@gmail.com")+"."));
      var btn = el("button","btn submit-btn", st.status==="sending" ? "Sending" : "Send inquiry");
      btn.disabled = st.status==="sending";
      btn.onclick = function(){
        st.err = validate(); if (st.err) { draw(); return; }
        st.status = "sending"; draw();
        fetch(ct.formEndpoint || "https://formspree.io/f/mlgwpppq", {
          method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
          body: JSON.stringify({ _subject: ct.subject || "Revelator Illuminae — design inquiry", name:st.name, email:st.email, phone:st.phone,
            department:"Revelator Illuminae", need: ct.option || "LIGHTING DESIGN (REVELATOR ILLUMINAE)", message:st.detail, source:"revelator" })
        }).then(function(r){ st.status = r.ok ? "success" : "error"; draw(); })
          .catch(function(){ st.status = "error"; draw(); });
      };
      wrap.appendChild(btn);
      wrap.appendChild(el("div","direct-email","Direct: "+esc(ct.directEmail||"fookn.oats.enterprises@gmail.com")));
    }
    draw();
  }

  fetch("./revelator.json?t="+Date.now())
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function(e){
      document.getElementById("hero-title").innerHTML = "Revelator<br>Illuminae<span class='dot'>.</span>";
      document.getElementById("hero-line").textContent = "Lighting design as its own credit. Content is loading slowly. Refresh, or write to fookn.oats.enterprises@gmail.com.";
      console.error("revelator.json failed", e);
    });
  </script>
</body>
</html>
